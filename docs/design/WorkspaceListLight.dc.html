<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace list, Gruvbox light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.fr{box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Cascadia Code','JetBrains Mono',Menlo,monospace;font-size:15px;line-height:21px;font-variant-ligatures:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) 420px 240px;column-gap:24px;white-space:pre;padding:0 12px;min-height:21px}
.gap{min-height:21px}
.mk{color:#7c6f64}
.proj{color:#3c3836;font-weight:700}
.ws{color:#3c3836}
.wscur{color:#b57614;font-weight:700}
.buf{color:#7c6f64}
.an{color:#7c6f64}
.st{text-align:right;color:#7c6f64}
.waiting{color:#b57614}.running{color:#79740e}.failed{color:#9d0006}.modified{color:#af3a03}
.sel{background:#ebdbb2}
.pt{background:#3c3836;color:#fbf1c7}
.sp{color:#bdae93}
.d{color:#7c6f64}
.kh{color:#b57614;font-weight:700}
</style>
</helmet>
<div class="fr" style="width: 1440px; height: 900px; background: #fbf1c7; color: #3c3836">
  <div style="height: 22px; line-height: 22px; flex: none; display: flex; justify-content: space-between; padding: 0 12px; background: #f2e5bc; color: #7c6f64; font-size: 13px; white-space: pre">
    <span><span style="color: #3c3836; font-weight: 700">aiditor</span><span class="sp"> › </span><span style="color: #b57614">watcher-fix</span> <span style="color: #b57614">●</span><span class="sp">  │  </span>aiditor › grep-progress <span style="color: #79740e">●</span><span class="sp">  │  </span>Legacy crap › cleanup <span style="color: #9d0006">●</span><span class="sp">  │  </span>zed › tab-bar</span>
    <span>20:41</span>
  </div>
  <div style="flex: 1; min-height: 0; overflow: hidden; padding-top: 6px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
      <sc-if value="{{r.isGap}}" hint-placeholder-val="{{false}}">
        <div class="gap"></div>
      </sc-if>
      <sc-if value="{{r.isRow}}" hint-placeholder-val="{{true}}">
        <div class="row {{r.sel}}"><span><span class="mk">{{r.pre}}</span><span class="{{r.cls}}">{{r.mark}}</span><span class="pt">{{r.first}}</span><span class="{{r.cls}}">{{r.name}}</span></span><span class="an">{{r.where}}</span><span class="st {{r.stCls}}">{{r.state}}</span></div>
      </sc-if>
    </sc-for>
  </div>
  <div style="height: 26px; line-height: 26px; flex: none; display: flex; justify-content: space-between; padding: 0 12px; background: #ebdbb2; white-space: pre">
    <span><span style="font-weight: 700">*Workspaces*</span><span class="sp">  │  </span><span class="d">5 projects, 4 workspaces</span></span>
    <span>4/7</span>
  </div>
  <div style="height: 26px; line-height: 26px; flex: none; padding: 0 12px; color: #7c6f64; white-space: pre"><span class="kh">n/p</span> move   <span class="kh">RET</span> switch   <span class="kh">TAB</span> fold   <span class="kh">q</span> quit</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { isRow: true, pre: '', mark: '', first: '', name: '', cls: '', where: '', state: '', stCls: '', sel: '' };
    const gap = () => ({ isGap: true });
    const project = (open, name, where, state, stCls, extra) => ({ ...base, pre: open ? '▾ ' : '▸ ', name, cls: 'proj', where, state: state || '', stCls: stCls || '', ...(extra || {}) });
    const empty = (name, where) => ({ ...base, pre: '  ', name, cls: 'proj', where });
    const workspace = (open, name, where, state, stCls, extra) => ({ ...base, pre: open ? '  ▾ ' : '  ▸ ', mark: '  ', name, cls: 'ws', where, state: state || '', stCls: stCls || '', ...(extra || {}) });
    const rows = [
      project(true, 'aiditor', '~/Code/aiditor'),
      workspace(false, 'watcher-fix', '6 buffers · 1 unsaved', '● awaiting permission', 'waiting', { mark: '* ', cls: 'wscur' }),
      workspace(false, 'grep-progress', '4 buffers', '● working', 'running'),
      gap(),
      project(false, 'egacy crap', '~/Code/legacy · 1 workspace', '● exited', 'failed', { first: 'L', sel: 'sel' }),
      project(false, 'zed', '~/Code/zed · 1 workspace'),
      empty('dotfiles', '~/Code/dotfiles · no workspaces'),
      empty('notes', '~/Documents/notes · no workspaces'),
    ];
    return { rows };
  }
}
</script>
</body>
</html>
