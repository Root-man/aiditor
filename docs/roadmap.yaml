# MVP roadmap, turned into GitHub milestones and issues by scripts/roadmap.py.
#
# Structure: milestone (phase, with its gate) → epic (parent issue) → task (sub-issue, one PR).
# The script adds a "Gate: <milestone>" issue at the end of each milestone, blocked by its epics.
# M0 and M1 are broken down into tasks. M2–M5 have epics plus the decisions and spikes already known;
# break them down when the milestone starts, and make each decision block the tasks it shapes.
#
# Item fields:
#   key         unique id, used by blocked_by (never shown on GitHub)
#   title       issue title; must be unique, since re-runs match existing issues by title
#   labels      area/kind/platform labels. Tasks inherit their epic's area and platform labels.
#               Epics get "epic" and tasks get "feature" automatically, unless a task already
#               has a kind label (decision, spike)
#   design      anchor in docs/editor.md; tasks inherit their epic's
#   body        description (markdown)
#   acceptance  checklist rendered under "Acceptance criteria"
#   blocked_by  keys of issues this one waits for

repo: Root-man/aiditor
design_doc: https://github.com/Root-man/aiditor/blob/main/docs/editor.md

labels:
  # area
  - { name: core, color: "1d76db", description: "Core state, command loop, model" }
  - { name: text, color: "0e8a16", description: "Rope buffers, markers, undo, editing commands" }
  - { name: keymap, color: "5319e7", description: "Commands, keymaps, key sequences" }
  - { name: minibuffer, color: "c5def5", description: "Minibuffer, completion, search UIs" }
  - { name: frontend, color: "fbca04", description: "GPUI frontend and display model" }
  - { name: files, color: "c2e0c6", description: "Opening, saving, watching and reverting files" }
  - { name: terminal, color: "000000", description: "PTY, VT emulator, terminal buffers" }
  - { name: acp, color: "d93f0b", description: "ACP client, agents, sessions" }
  - { name: project, color: "0052cc", description: "Projects and workspaces" }
  - { name: persistence, color: "bfd4f2", description: "Auto-save and recovery" }
  - { name: infra, color: "ededed", description: "Build, CI, test harness" }
  # kind
  - { name: epic, color: "3e4b9e", description: "Parent issue grouping one feature area" }
  - { name: feature, color: "a2eeef", description: "Implementation task, one PR" }
  - { name: decision, color: "f9d0c4", description: "Open question to settle before dependent work" }
  - { name: spike, color: "fef2c0", description: "Time-boxed investigation" }
  - { name: gate, color: "b60205", description: "Milestone gate, tested by hand" }
  # platform
  - { name: macos, color: "e4e669", description: "macOS-specific" }
  - { name: linux, color: "d4c5f9", description: "Linux-specific" }

milestones:
  # ───────────────────────────────────────────── M0 ─────────────────────────────────────────────
  - key: m0
    title: "M0 · Skeleton"
    description: "Rope buffers, undo, window splits, keymap trie, minibuffer, find-file, save, auto-save and recovery."
    gate: "Edit and save a file using Emacs keys only."
    epics:
      - key: m0-setup
        title: "Project setup: crate layout, CI, test harness"
        labels: [infra]
        design: "#testing"
        body: |
          Split the single crate into a workspace that enforces the core/frontend boundary, get CI green on both platforms, and provide the headless harness most tasks test with.
        tasks:
          - key: m0-crates
            title: "Split into a cargo workspace: aiditor-core, aiditor-services, aiditor"
            body: |
              `aiditor-core` holds editor state and has no GPUI or Tokio dependency. `aiditor-services` holds the async I/O tasks. `aiditor` is the binary that hosts the core on GPUI's main thread and starts the Tokio runtime. Move the current dependencies to the crates that use them. (Not `core`: that name collides with Rust's built-in crate and breaks `::core::` paths in derive macros.)
            acceptance:
              - "`cargo build` and `cargo test` pass on macOS and Linux"
              - "`cargo tree -p aiditor-core` shows neither `gpui` nor `tokio`"
          - key: m0-ci
            title: "CI on macOS and Linux"
            labels: [macos, linux]
            body: |
              GitHub Actions running fmt, clippy and tests on macOS and Linux, with the Linux system packages GPUI needs and a cargo cache.
            acceptance:
              - "`cargo fmt --check`, `cargo clippy -- -D warnings` and `cargo test` run on both platforms"
              - "The check from the crate split (aiditor-core has no GPUI/Tokio) runs in CI"
            blocked_by: [m0-crates]
          - key: m0-tracing
            title: "Logging with tracing"
            body: |
              `tracing` with `tracing-subscriber` and an env filter, writing to stderr for now. The Messages buffer picks it up later.
            acceptance:
              - "`RUST_LOG` controls the log level"
            blocked_by: [m0-crates]
          - key: m0-harness
            title: "Test harness: headless core driven by key scripts"
            body: |
              A test helper that creates a core with temp-dir files, feeds it a key script (`"hello C-x C-s"`), and exposes buffer text and point for assertions. Once the display builder lands, it also exposes the display model for `insta` snapshots. Every task whose acceptance says "key-script tests" depends on this one.
            acceptance:
              - "One test types into a buffer through the harness and checks text and point"
            blocked_by: [m0-command-loop]

      - key: m0-frontend
        title: "Frontend: GPUI host for the core"
        labels: [frontend]
        design: "#the-core-runs-on-the-ui-thread"
        body: |
          The GPUI app that holds the core on the main thread, draws its display model and feeds it input. Starts with spikes, because everything else depends on GPUI doing what the design assumes, and gets a walking skeleton running early so every later task lands in a working app.
        tasks:
          - key: m0-spike-gpui
            title: "Spike: GPUI drawing, raw keys, IME, Tokio and CI"
            labels: [spike, macos, linux]
            body: |
              Time-box: 3 days. Throwaway code, findings written to `docs/spikes/gpui.md`. Answer:
              - Can we draw monospace lines with styled spans and a cursor from our own model, at frame rate, on macOS and Linux?
              - Can we receive raw key-down events with all modifiers before GPUI's keymap and actions see them?
              - How do Option-as-Meta and Option-for-characters (dead keys) look at the event level on macOS?
              - How does IME (marked text) reach us through GPUI's input handler?
              - Can a Tokio runtime on background threads send to a channel that a GPUI foreground task drains?
              - Can GPUI render on CI runners for screenshot tests (on Linux: a display server and software Vulkan), or does it have a headless test platform? If neither works cheaply, screenshot tests become manual checks.
            acceptance:
              - "Findings doc answers every question, with a recommendation for each"
          - key: m0-spike-session-display
            title: "Decide: display model for the session buffer"
            labels: [decision, spike]
            design: "#open-questions"
            body: |
              Time-box: 2 days, can run in parallel with the GPUI spike's later questions. The design doc says "visible lines with styled spans" cannot express the session buffer: rendered markdown, collapsible tool calls, the plan, and a read-only transcript above an editable prompt. Decide how the display model covers it (block or widget regions, folded regions, read-only text properties) and how the text projection works for search, mark and kill, so the display builder is built once in M0 instead of reworked in M3. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md, including what it changes in the display model"
            blocked_by: [m0-spike-gpui]
          - key: m0-decide-keys
            title: "Decide: key handling on macOS"
            labels: [decision, macos]
            design: "#open-questions"
            body: |
              Option as Meta or Option for special characters and dead keys (or per side); IME input; Cmd-C/V/Q and other Cmd bindings; how keys bypass GPUI's keymap to reach the key trie. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
            blocked_by: [m0-spike-gpui]
          - key: m0-walking-skeleton
            title: "Walking skeleton: open, type and save in a GPUI window"
            labels: [macos, linux]
            body: |
              `aiditor FILE` opens the file into a rope buffer through the core, draws it in one window, accepts typing and arrow keys, and saves with `C-x C-s`. Key handling and drawing are hardcoded and minimal; later tasks replace each piece (key trie, display builder, file service). From here on, every task lands in an app you can run.
            acceptance:
              - "Edit and save a real file on macOS and Linux"
            blocked_by: [m0-spike-gpui, m0-core-skeleton, m0-buffer]
          - key: m0-frontend-render
            title: "Render the display model in GPUI"
            body: |
              Replace the skeleton's drawing: each window's visible lines, styled spans, cursor and region, the mode lines, the echo area and the minibuffer, laid out by the split tree. Font family and size come from settings. Add per-frame shaping time to the `--debug` stats line. Report the frame size and cell metrics to the core on resize.
            acceptance:
              - "Splits render with the right sizes; resizing the frame re-lays them out"
              - "A manual rendering checklist in the PR (no screenshot tests, see docs/spikes/gpui.md)"
            blocked_by: [m0-walking-skeleton, m0-display, m0-splits, m0-config]
          - key: m0-frontend-input
            title: "Feed key and mouse events to the core"
            body: |
              Replace the skeleton's key handling: translate GPUI key events into the core's key representation according to the key-handling decision, including IME text, plus the mouse events the clipboard-and-mouse decision puts in the MVP.
            acceptance:
              - "Every key in the default keymap reaches the core on macOS and Linux"
            blocked_by: [m0-walking-skeleton, m0-decide-keys, m0-decide-clipboard, m0-keytrie]

      - key: m0-text
        title: "Text model: buffers, markers, undo"
        labels: [text, core]
        design: "#core-data-model"
        body: |
          The buffer model everything else sits on: a rope backend, markers that follow edits, and undo grouped per command.
        tasks:
          - key: m0-buffer
            title: "Rope buffer with an edit API"
            body: |
              Buffer ids and a buffer registry; insert and delete by char offset on a `ropey` rope; line/column conversions; modified flag; file binding. Model the content backend so terminal and session backends can be added later.
            acceptance:
              - "Unit tests for edits, offsets and line/column conversion, including non-ASCII text"
            blocked_by: [m0-crates]
          - key: m0-markers
            title: "Markers that follow edits"
            body: |
              Markers with insertion type (stay before or move after text inserted at them). Window point and mark will be markers, so edits made elsewhere move them correctly.
            acceptance:
              - "Markers before, at and after an edit move correctly for both insertion types, for inserts and deletes"
            blocked_by: [m0-buffer]
          - key: m0-undo
            title: "Undo and redo grouped per command"
            body: |
              Linear undo with a redo stack, per buffer. One group per command; consecutive self-inserts amalgamate (like Emacs's 20 characters). Undo restores point.
            acceptance:
              - "Undo/redo round trips restore text and point"
            blocked_by: [m0-buffer]
          - key: m0-text-proptest
            title: "Property tests for the text model"
            body: |
              `proptest` over random edit sequences: undo all returns the original text, redo all returns the final text, markers stay in bounds.
            acceptance:
              - "Property tests run in CI"
            blocked_by: [m0-markers, m0-undo]

      - key: m0-commands
        title: "Core loop, commands and keymaps"
        labels: [keymap, core]
        design: "#commands-and-keymaps"
        body: |
          The core's skeleton (state machine, effects, service bridge, timers) and Emacs's command model on top of it: named commands with argument specs, a command loop, layered keymaps resolved by a key-sequence trie, prefix arguments, keymaps in TOML.
        tasks:
          - key: m0-core-skeleton
            title: "Core state machine, effects, service bridge and timers"
            labels: [frontend]
            body: |
              The `Core`, `Msg`, `Effects` and `Ctx` types and `handle(&mut Core, Msg) -> Effects`. The app starts the Tokio runtime, hands services a sender, and drains their results into the core from a GPUI foreground task. Timers (one-shot and repeating, cancellable) arrive as messages; auto-save, the which-key delay and debounced grep use them.
            acceptance:
              - "A test service's result reaches the core as a message"
              - "Timers fire as messages in tests, driven by a fake clock"
            blocked_by: [m0-crates, m0-spike-gpui]
          - key: m0-registry
            title: "Command registry and argument specs"
            body: |
              Commands with a name, an argument spec (prefix arg, region, prompted string) and a handler `fn(&mut Ctx, Args) -> Result`. Errors go to the echo area.
            acceptance:
              - "Commands can be looked up by name and called with arguments from tests"
            blocked_by: [m0-core-skeleton]
          - key: m0-keytrie
            title: "Key sequences and keymap layering"
            body: |
              A trie of key sequences with prefix keys (`C-x`, `C-c`, `C-x 4`). Lookup order: transient map → minor-mode maps → major-mode map → global map. Undefined keys show a message; `C-g` cancels a pending prefix.
            acceptance:
              - "A minor-mode binding shadows a global one; removing the mode restores it"
            blocked_by: [m0-registry]
          - key: m0-command-loop
            title: "Command loop"
            body: |
              Key event → key sequence → command → effects. Tracks this/last command, sets the undo boundary per command, and records the key stream so keyboard macros (M5) can be added without changing the loop.
            acceptance:
              - "Key sequences fed to the core run commands and update buffers"
            blocked_by: [m0-registry, m0-keytrie, m0-undo]
          - key: m0-prefix-arg
            title: "Prefix argument"
            body: |
              `C-u`, repeated `C-u`, `M-<digit>`, `C-u <digits>` and `C--`, passed to every command.
            acceptance:
              - "A test command receives 3 for `C-u 3`, 16 for `C-u C-u` and -1 for `C--`"
            blocked_by: [m0-command-loop, m0-harness]
          - key: m0-keymap-toml
            title: "Keymaps from TOML, reloadable"
            body: |
              A bundled default keymap file and user overrides from the config dir, loaded through the settings module. Bad entries are reported in the echo area and the rest still loads.
            acceptance:
              - "Changing a binding in the user file and reloading takes effect without restart"
            blocked_by: [m0-keytrie, m0-config]
          - key: m0-which-key
            title: "Hint after a prefix key"
            body: |
              After a short delay (a timer) on a prefix key, show the keys that can follow and their commands, which-key style, as part of the display model.
            acceptance:
              - "Pressing `C-x` and waiting lists the `C-x` bindings (display snapshot)"
            blocked_by: [m0-keytrie, m0-display, m0-core-skeleton]

      - key: m0-editing
        title: "Basic editing commands"
        labels: [text]
        design: "#commands-and-keymaps"
        body: |
          Enough Emacs editing to pass the M0 gate without touching the mouse.
        tasks:
          - key: m0-motion
            title: "Motion commands"
            body: |
              `C-f/b/n/p`, `M-f/b`, `C-a/e`, `M-</>`, `C-v/M-v`, `C-l`, with a goal column for vertical motion, honouring the prefix argument.
            acceptance:
              - "Key-script tests for each command, including `C-u 3 C-f`"
            blocked_by: [m0-window-model, m0-prefix-arg, m0-harness]
          - key: m0-insert-delete
            title: "Insertion and deletion commands"
            body: |
              Self-insert, `RET`, `C-j`, `C-o`, `C-d`, `DEL`, `M-d`, `M-DEL`, honouring the prefix argument.
            acceptance:
              - "Key-script tests for each command, including `C-u 3 a`"
            blocked_by: [m0-window-model, m0-prefix-arg, m0-harness]
          - key: m0-mark-region
            title: "Mark, region and C-g"
            body: |
              `C-SPC`, `C-x C-x`, the mark ring, an active region highlighted in the display, and `C-g` to deactivate the mark and quit.
            acceptance:
              - "Region shows in display snapshots; `C-g` clears it"
            blocked_by: [m0-window-model, m0-command-loop, m0-display, m0-harness]
          - key: m0-decide-clipboard
            title: "Decide: system clipboard and mouse in the MVP"
            labels: [decision]
            design: "#open-questions"
            body: |
              How the kill ring syncs with the system clipboard, and which mouse interactions (click to move point, drag to select, scroll) are in the MVP. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
          - key: m0-kill-ring
            title: "Kill ring and yank"
            body: |
              `C-k`, `C-w`, `M-w`, `C-y`, `M-y`. Consecutive kills append to the same entry. Syncs with the system clipboard as decided.
            acceptance:
              - "Two consecutive `C-k` yank back as one entry"
            blocked_by: [m0-mark-region, m0-decide-clipboard]

      - key: m0-windows
        title: "Windows and the display model"
        labels: [core, frontend]
        design: "#core-data-model"
        body: |
          Windows as viewports onto buffers, split trees, and the display model the frontend draws.
        tasks:
          - key: m0-window-model
            title: "Window model: point, mark and scroll"
            body: |
              A window shows one buffer and holds its point and mark (as markers) and its scroll position; scrolling keeps point visible. One window per frame until split commands land.
            acceptance:
              - "Unit tests: an edit before point moves point; scrolling follows point"
            blocked_by: [m0-markers]
          - key: m0-display
            title: "Display builder"
            body: |
              Per window: visible lines (each with its own height) with styled spans, folds (invisible ranges with a placeholder), whole-line decorations, cursor, region overlay and a mode line, built from core state for the current frame size, following the session-buffer display decision. Monospace font, but positions come from shaped lines, not a cell grid, so faces can later carry their own font and size. Long lines follow the file-handling decision (truncated until then).
            acceptance:
              - "`insta` snapshots of the display model through the harness"
            blocked_by: [m0-window-model, m0-spike-session-display, m0-harness]
          - key: m0-splits
            title: "Split-tree commands"
            body: |
              Split tree with ratios; `C-x 2`, `C-x 3`, `C-x o`, `C-x 0`, `C-x 1`. Each window keeps its own point and scroll position.
            acceptance:
              - "Two windows on the same buffer keep separate points"
              - "Display snapshots of horizontal and vertical splits"
            blocked_by: [m0-window-model, m0-command-loop, m0-display]
          - key: m0-echo
            title: "Echo area"
            body: |
              Messages and errors shown in the echo area, cleared on the next key; `C-g` shows "Quit".
            acceptance:
              - "Command errors appear in the echo area and in display snapshots"
            blocked_by: [m0-display]

      - key: m0-minibuffer
        title: "Minibuffer and completion"
        labels: [minibuffer]
        design: "#commands-and-keymaps"
        body: |
          A real one-line buffer for every prompt, with history and a vertical fuzzy completion list. Hosts `M-x`, `find-file` and buffer switching in M0.
        tasks:
          - key: m0-mb-core
            title: "Minibuffer as a buffer"
            body: |
              One-line buffer with its own keymap and a prompt; `RET` returns, `C-g` aborts; history rings per prompt kind with `M-p`/`M-n`. Normal editing commands work inside it.
            acceptance:
              - "A command can prompt for a string from a key script"
            blocked_by: [m0-command-loop, m0-display]
          - key: m0-mb-completion
            title: "Fuzzy completion list"
            body: |
              A vertical list of candidates matched with `nucleo`, `C-n`/`C-p` to move the selection, `TAB` to complete. `nucleo` runs matching on its own worker threads; the core feeds it candidates and polls it with `tick()` after input and on each frame, so no Tokio service is needed.
            acceptance:
              - "Typing filters candidates; snapshots show the list"
            blocked_by: [m0-mb-core]
          - key: m0-mx
            title: "M-x"
            body: |
              Completes over all commands and shows each command's key binding.
            acceptance:
              - "`M-x` runs a registered command by name and shows its binding in the list"
            blocked_by: [m0-mb-completion]
          - key: m0-find-file
            title: "find-file"
            body: |
              `C-x C-f` with path completion from the current buffer's directory; opens an existing file or creates a new buffer for a new one.
            acceptance:
              - "Opening an existing file and a new file both work"
            blocked_by: [m0-mb-completion, m0-file-io]
          - key: m0-switch-buffer
            title: "Switch and kill buffers"
            body: |
              `C-x b` with completion over buffers (most recent first), `C-x 4 b`, and `C-x k`. Scoping to the workspace comes in M1.
            acceptance:
              - "Switching back to a buffer restores its last point"
            blocked_by: [m0-mb-completion, m0-splits]

      - key: m0-files
        title: "Files, settings, scratch and Messages buffers"
        labels: [files, core]
        design: "#core-data-model"
        body: |
          Settings loading, opening and saving files safely, the built-in buffers, and quitting without losing work.
        tasks:
          - key: m0-config
            title: "Settings: TOML loading and reload"
            body: |
              One settings module for every TOML file: bundled defaults plus user files from the config dir (`directories` crate), validated with serde, errors reported in the echo area, reloaded by command. Keymaps, project files, the agent registry, formatters, theme and font all go through it. M0 settings: font family and size, a default theme.
            acceptance:
              - "Changing the font size and reloading takes effect"
              - "A bad value reports an error and keeps the previous value"
            blocked_by: [m0-core-skeleton]
          - key: m0-decide-files
            title: "Decide: file handling rules"
            labels: [decision]
            design: "#open-questions"
            body: |
              Encodings, CRLF line endings, final newline, binary files, keeping file permissions on save, atomic saves versus symlinks and hard links, and long lines: truncate or soft wrap (Markdown is first-class, so wrapping matters). Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
          - key: m0-file-io
            title: "Open and save files with a hash check"
            body: |
              File reads and writes run in a service, replacing the walking skeleton's direct writes. Loading records the content hash; `C-x C-s` checks the disk hash first and refuses with a message if the file changed (the full conflict flow comes in M1). Loading and saving follow the file-handling rules decided in #45: UTF-8 with the BOM kept, the file's line ending (LF or CRLF, `(DOS)` in the mode line) restored on save, a final newline added on save, binary files refused, and atomic saves that keep the mode, symlinks and hard links.
            acceptance:
              - "Saving over a file changed on disk is refused"
              - "File permissions survive a save"
              - "A CRLF file saves with CRLF and a BOM survives a save"
              - "A save adds a missing final newline"
              - "A binary or non-UTF-8 file is refused with a message"
              - "Saving through a symlink keeps the symlink; saving a hard-linked file keeps the link"
            blocked_by: [m0-buffer, m0-core-skeleton, m0-decide-files]
          - key: m0-hscroll
            title: "Horizontal scroll for long lines"
            labels: [frontend]
            body: |
              Emacs's `auto-hscroll-mode` set to `current-line`, as decided in #45: each window has a horizontal scroll offset that moves so point stays visible, applied only to point's line; other lines stay truncated at the window edge.
            acceptance:
              - "`C-e` on a line wider than the window keeps the cursor visible (display snapshot)"
              - "Other lines of the window are not shifted"
            blocked_by: [m0-decide-files, m0-display]
          - key: m0-special-buffers
            title: "Scratch and Messages buffers"
            body: |
              A scratch buffer on startup. A Messages buffer that collects echo-area messages and `tracing` output.
            acceptance:
              - "Echo-area messages and log lines appear in Messages"
            blocked_by: [m0-buffer, m0-tracing, m0-echo]
          - key: m0-quit
            title: "Quit with unsaved buffers"
            body: |
              `C-x C-c` offers to save each modified file buffer before quitting.
            acceptance:
              - "Quitting with a modified buffer prompts; declining keeps the editor open"
            blocked_by: [m0-file-io, m0-mb-core]

      - key: m0-crash
        title: "Crash safety: auto-save and recovery"
        labels: [persistence]
        design: "#subsystems"
        body: |
          Unsaved edits survive a crash: auto-save files outside the repos, recovery on launch, and panics in commands that don't take the editor down.
        tasks:
          - key: m0-autosave
            title: "Auto-save dirty buffers to the recovery dir"
            body: |
              About 2 s after the last edit, and at least every 30 s while dirty (timers), write the buffer's text to the recovery dir under the platform data dir, with the original path, base disk hash and time. Written by a service via temp file and rename. Deleted on save, revert or kill. Covers file and scratch buffers.
            acceptance:
              - "Recovery files appear while a buffer is dirty and disappear after save"
              - "Nothing is ever written inside the project's directories"
            blocked_by: [m0-file-io, m0-core-skeleton]
          - key: m0-recovery
            title: "Recover buffers on launch"
            body: |
              If recovery files exist at launch, list them; for each, open it as a dirty buffer with the recovered text, or discard it. (Compare with disk arrives with the diff buffer in M1.)
            acceptance:
              - "A recovered buffer opens dirty, bound to its original file"
            blocked_by: [m0-autosave, m0-mb-completion]
          - key: m0-catch-unwind
            title: "Contain panics in commands"
            body: |
              Run each command under `catch_unwind`. Log the panic and backtrace to Messages, note that the command's state may be inconsistent, and keep running.
            acceptance:
              - "A test command that panics leaves the editor running and logs to Messages"
              - "CI fails if any build profile sets `panic = \"abort\"`, which would silently disable this"
            blocked_by: [m0-command-loop, m0-special-buffers]
          - key: m0-crash-e2e
            title: "End-to-end crash recovery test"
            labels: [infra]
            body: |
              A headless binary (core and services, no GPUI) driven by a key script: edit a file, kill the process, relaunch, check the recovered buffer. It tests the same recovery path without needing a GUI on CI runners.
            acceptance:
              - "Test runs in CI on both platforms"
            blocked_by: [m0-recovery, m0-harness]

  # ───────────────────────────────────────────── M1 ─────────────────────────────────────────────
  - key: m1
    title: "M1 · Projects + workspaces"
    description: "Primary repo + extra roots, project commands, finder and grep across repos, workspaces with their own layouts and buffers, file sync."
    gate: "In two workspaces on different projects, find a file from an additional root, grep across two roots and jump to a hit, then keep editing while an external write auto-reverts another open buffer."
    epics:
      - key: m1-projects
        title: "Projects: project files and commands"
        labels: [project]
        design: "#projects"
        body: |
          A project is a TOML file in the config dir listing a primary repo and additional roots with role lines.
        tasks:
          - key: m1-project-file
            title: "Project file format and loading"
            body: |
              TOML schema, loaded through the settings module: name, primary repo, additional roots (path and role line), default agent. Validate that paths exist and are absolute; report errors in the echo area.
            acceptance:
              - "Round-trip tests for the project file; invalid files give clear errors"
          - key: m1-decide-roots
            title: "Decide: nested roots and folders without a project"
            labels: [decision]
            design: "#open-questions"
            body: |
              Nested or overlapping roots within one project or across projects; whether and how to open a single folder without a project. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
          - key: m1-project-commands
            title: "Project commands"
            body: |
              Create a project, add or remove a root, edit a root's role line, set the default agent, open the project file for editing. Save an ad-hoc project (one made by opening a folder) to `projects/`. All as keys and `M-x`.
            acceptance:
              - "A project can be created and edited entirely from the editor"
              - "Saving an ad-hoc project writes a project file that loads back as the same project"
            blocked_by: [m1-project-file, m1-decide-roots]
          - key: m1-decide-switch
            title: "Decide: what \"switch project\" does"
            labels: [decision]
            design: "#open-questions"
            body: |
              Now that workspaces are bound to projects: jump to an existing workspace of that project, create one, or ask. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"

      - key: m1-workspaces
        title: "Workspaces"
        labels: [project, core]
        design: "#workspaces"
        body: |
          A workspace holds everything for one task: its own buffers and window configuration, bound to one project.
        tasks:
          - key: m1-decide-messages
            title: "Decide: where the Messages buffer lives"
            labels: [decision]
            design: "#open-questions"
            body: |
              Every buffer belongs to one workspace, but Messages collects output from everywhere. Global exception, one per workspace, or something else. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
          - key: m1-ws-model
            title: "Workspace model and buffer ownership"
            body: |
              Workspaces bound to a project; every buffer belongs to exactly one workspace (Messages as decided); opening a file already open in another workspace creates a second buffer; a new workspace starts with a scratch buffer; killing a workspace kills its buffers.
            acceptance:
              - "Lifecycle tests: kill a workspace, its buffers are gone, other workspaces are untouched"
            blocked_by: [m1-project-file, m1-decide-messages]
          - key: m1-ws-windows
            title: "Window configuration per workspace"
            body: |
              Each workspace keeps its own split tree; switching workspaces restores it.
            acceptance:
              - "Switching away and back restores splits, buffers and points"
            blocked_by: [m1-ws-model]
          - key: m1-decide-launch
            title: "Decide: launching without a project"
            labels: [decision]
            design: "#projects"
            body: |
              Every workspace has a project, so what does a launch that names no project get? A file on the command line, and a launch with no argument (from a shell, or from the macOS Dock or Finder, whose working directory is `/`). Settles the projectless `default` workspace #62 started with, and what the file index and watcher do with a project as large as `$HOME`. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
          - key: m1-ws-commands
            title: "Workspace commands"
            body: |
              New workspace (prompts for project), switch, next/previous, rename, kill, list. Keys under the workspace prefix and `M-x`. Open folder: a folder named on the command line or picked with an open-folder command gets an ad-hoc in-memory project (folder as primary, its name as the project name) and a workspace for it; nothing is written to disk. Switch project: prompts for a project, then shows its most recently shown workspace, or creates one when it has none. Launch, as "Decide: launching without a project" settled: a file on the command line opens in a workspace of the first loaded project whose roots contain it, else of an ad-hoc project at its nearest enclosing git repo, else at its folder; a launch with no argument gets a workspace on an ad-hoc `$HOME` project, with file watching off. Every workspace then has a project: the projectless `default` workspace goes, and a workspace's project is required. Killing a workspace asks about its modified file buffers first, as `C-x C-c` does.
            acceptance:
              - "Key-script tests for each command"
              - "Opening a folder without a project gives a workspace on an ad-hoc project and writes no file"
              - "Switch project shows the project's most recently shown workspace, and creates one only when the project has none"
              - "A file named on the command line opens in a workspace of the project that contains it, or of an ad-hoc project at its git repo or folder; a launch with no argument gets an ad-hoc `$HOME` project; no workspace is without a project"
              - "Killing a workspace with a modified file buffer asks before killing it"
            blocked_by: [m1-ws-model, m1-decide-switch, m1-decide-launch]
          - key: m1-ws-strip
            title: "Workspace strip in the frontend"
            labels: [frontend]
            body: |
              A strip along the top showing each workspace's name and project, highlighting the current one.
            acceptance:
              - "Screenshot test with two workspaces if CI can run them; otherwise a manual checklist in the PR"
            blocked_by: [m1-ws-commands]
          - key: m1-ws-scoped-switch
            title: "Scope buffer switching to the workspace"
            body: |
              `C-x b` and the buffer switcher list only the current workspace's buffers.
            acceptance:
              - "Buffers from another workspace don't appear"
            blocked_by: [m1-ws-model]

      - key: m1-finder
        title: "File finder across project roots"
        labels: [minibuffer, project]
        design: "#subsystems"
        body: |
          Find any file in any root of the project, with live preview.
        tasks:
          - key: m1-file-index
            title: "File index service"
            body: |
              Walk all project roots with `ignore` (respecting `.gitignore`) off the core thread; refresh on demand. (Refresh on file events is wired up with the watcher.)
            acceptance:
              - "Indexing a large repo doesn't block typing"
            blocked_by: [m1-project-file]
          - key: m1-preview
            title: "Live preview from the minibuffer"
            body: |
              A generic preview hook: moving the selection shows the candidate in the selected window; `C-g` restores the previous window state. Used by buffer switching, the file finder and grep.
            acceptance:
              - "Preview then `C-g` leaves windows exactly as before"
            blocked_by: [m1-ws-windows]
          - key: m1-find-in-project
            title: "Find file across roots"
            body: |
              Candidates are relative paths prefixed by the root's name, matched with `nucleo`, with live preview.
            acceptance:
              - "Files from the primary repo and an additional root are both found"
            blocked_by: [m1-file-index, m1-preview]

      - key: m1-search
        title: "Project grep and swiper"
        labels: [minibuffer]
        design: "#subsystems"
        body: |
          consult-style project grep and swiper-style in-buffer search, plus jump history.
        tasks:
          - key: m1-decide-editing
            title: "Decide: C-s and the remaining editing commands"
            labels: [decision]
            design: "#open-questions"
            body: |
              Isearch versus swiper on `C-s` (needed for the swiper task), and which of comment toggle (`M-;`), fill paragraph (`M-q`) in Markdown, query-replace, save-as and recent files are in the MVP and when. Implementation goes into M5's editing epic unless the decision pulls something earlier. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
          - key: m1-grep-service
            title: "Grep service"
            body: |
              `grep-searcher` over all roots with `ignore`; streams results to the core; a new query cancels the previous search; results capped.
            acceptance:
              - "Cancelling a search on a large repo stops it promptly"
            blocked_by: [m1-project-file]
          - key: m1-grep-ui
            title: "Project grep in the minibuffer"
            body: |
              Live results as you type (debounced with a timer), preview of the selected hit, `RET` jumps to it.
            acceptance:
              - "Key-script test: search, move, jump"
            blocked_by: [m1-grep-service, m1-preview]
          - key: m1-swiper
            title: "Swiper-style line search"
            body: |
              List the current buffer's matching lines in the minibuffer with preview; `RET` jumps. Bound to `C-s`, as decided in #72.
            acceptance:
              - "Key-script test: search, move, jump"
            blocked_by: [m1-preview, m1-decide-editing]
          - key: m1-jump-history
            title: "Jump history"
            body: |
              Record a position before every jump (grep hit, file finder, swiper, buffer switch); commands to go back and forward across buffers.
            acceptance:
              - "Back after a grep jump returns to the original position"
            blocked_by: [m1-grep-ui]

      - key: m1-sync
        title: "File watching, auto-revert and conflicts"
        labels: [files, core]
        design: "#core-data-model"
        body: |
          Buffers follow the disk: clean buffers auto-revert, dirty ones become conflicted and are resolved by hand.
        tasks:
          - key: m1-decide-watcher
            title: "Decide: file watcher edge cases"
            labels: [decision, linux]
            design: "#open-questions"
            body: |
              Files deleted or renamed on disk, files open from outside the project roots, skipping large ignored trees under inotify on Linux (a project's ignore patterns and the watched-files limit, "Project ignore patterns for the index and the watcher" and "Limit on watched files per project", cover part of this). (The editor's own saves are already settled: the watcher reports them, and each buffer filters by comparing hashes.) Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
          - key: m1-revert-diff
            title: "Revert by applying a diff"
            labels: [text]
            body: |
              Compute a diff between buffer and new text off the core thread (`similar` or `imara-diff`) and apply it as one undo group, so point, mark and markers survive.
            acceptance:
              - "Point stays on the same line after a revert that changes lines above it"
          - key: m1-watcher
            title: "File watcher service"
            body: |
              `notify` backends per OS that report, debounced, the paths that may have changed, as "Decide: file watcher edge cases" settled: on macOS one recursive FSEvents watch per root, with events under ignored paths dropped; on Linux one non-recursive inotify watch per directory the `ignore` walk keeps, added for new directories as they appear. A visited file no root watch covers (outside the roots, under an ignored directory, or in an unwatched project) gets a shared watch on its parent directory. Each buffer visiting a reported path, or a file under a reported directory, is checked against the disk; a missing file puts it in the deleted state (`[deleted]` in the mode line, `C-x C-s` writes it back), and a lost-events rescan checks them all. The watcher reports every change, including the editor's own saves; filtering happens per buffer. File creates and deletes also refresh the file index.
            acceptance:
              - "External writes produce one event per change after debouncing"
              - "Creating or deleting a file updates the file finder"
              - "Another program's atomic save (a rename over the file) is still seen, and so are later writes to it"
              - "Deleting or renaming an open file, or the directory holding it, shows `[deleted]`; `C-x C-s` writes it back, and a clean deleted buffer doesn't stop `C-x C-c`"
              - "A file outside the project's roots is watched while a buffer visits it, and its watch goes with the last such buffer"
              - "On Linux, an ignored `node_modules` gets no inotify watch"
            blocked_by: [m1-decide-watcher, m1-project-file, m1-file-index]
          - key: m1-project-ignore
            title: "Project ignore patterns for the index and the watcher"
            labels: [project]
            body: |
              Projectile's `.projectile`, for aiditor: gitignore-syntax patterns in the project file (`ignore = [...]`), applied on top of `.gitignore` by the file index, grep and the watcher. Negations make an allow-list (`*` then `!notes/`), so a project as large as `$HOME` can be narrowed to the directories that matter. A `.ignore` file in a root is honoured too, as the `ignore` crate already does.
            acceptance:
              - "A file matched by a pattern is not in the file finder, grep results or watch events"
              - "An allow-list (`*`, `!dir/`) indexes and watches only `dir`"
              - "Patterns are checked when the project file loads; a bad one rejects the file like any other error"
            blocked_by: [m1-file-index, m1-watcher, m1-decide-launch]
          - key: m1-project-watch
            title: "Project setting: file watching on or off"
            labels: [project]
            body: |
              A `watch` key in the project file, `true` by default and `false` for the ad-hoc `$HOME` project (see "Decide: launching without a project"). With watching off, the project's roots get no watcher: the file index refreshes on demand only, and an open file is still watched through its parent directory (see "Decide: file watcher edge cases"). Setting it through the project commands, and the mode line or `*Messages*` saying a project is unwatched, are part of this task.
            acceptance:
              - "A project with `watch = false` gets no root watcher, and its index still refreshes on demand"
              - "An open file in an unwatched project still auto-reverts when it changes on disk"
              - "The ad-hoc `$HOME` project is unwatched by default"
            blocked_by: [m1-watcher, m1-decide-launch]
          - key: m1-watch-limit
            title: "Limit on watched files per project"
            labels: [project]
            body: |
              Like lsp-mode's `lsp-file-watch-threshold`: a `max_watched_files` setting in `settings.toml`, overridable per project file. Counted after the ignore patterns. A project over the limit is not watched; the echo area and `*Messages*` say so with the count and the setting's name, and the project behaves as with `watch = false`. On Linux, the inotify watches go per directory, so the count also guards the system's `max_user_watches`.
            acceptance:
              - "A project over the limit gets no watcher and says why; under it, it is watched"
              - "A project file's limit overrides the settings file's"
            blocked_by: [m1-watcher, m1-project-ignore]
          - key: m1-auto-revert
            title: "Auto-revert clean buffers"
            body: |
              On a change event, each buffer visiting the file compares the new disk hash with its own stored hash. The buffer that just saved sees no change; every other clean buffer of that file reverts, in every workspace.
            acceptance:
              - "A save in one workspace reverts the same file's buffer in another, and leaves the saving buffer alone"
            blocked_by: [m1-watcher, m1-revert-diff, m1-ws-model]
          - key: m1-diff-view
            title: "Diff buffer: buffer against disk"
            body: |
              A read-only buffer showing a unified diff of a buffer's text against its file on disk, built from the revert diff. Used by the conflict flow and by M0's recovered buffers.
            acceptance:
              - "A recovered buffer can be compared with its file on disk"
            blocked_by: [m1-revert-diff]
          - key: m1-conflict
            title: "Conflict flow for dirty buffers"
            body: |
              A dirty buffer whose file changes is marked conflicted in the mode line. On focus or save, offer: keep mine, take disk (unsaved text stays in undo), or compare (opens the diff buffer).
            acceptance:
              - "Each of the three choices behaves as described in docs/editor.md"
            blocked_by: [m1-auto-revert, m1-diff-view]
          - key: m1-sync-tests
            title: "File sync test suite"
            labels: [infra]
            body: |
              External writes to temp repos: the right buffers auto-revert, dirty buffers become conflicted, a buffer's own save doesn't revert it.
            acceptance:
              - "Suite runs in CI on both platforms"
            blocked_by: [m1-conflict]

  # ───────────────────────────────────────────── M2 ─────────────────────────────────────────────
  - key: m2
    title: "M2 · Terminal"
    description: "PTY + VT emulator buffers, char and copy mode, shell integration."
    gate: "Run the test suite and make a git commit in a terminal buffer, and on macOS type in a file buffer with no visible lag while `yes` and a large `cat` flood a terminal (Linux checked in #226)."
    epics:
      - key: m2-pty
        title: "PTY service"
        labels: [terminal]
        design: "#output-floods"
        body: |
          `portable-pty` running the user's shell as a login shell. Batched reads (up to ~64 KB per message), one small bounded channel per terminal for backpressure, input, resize and kill.
        tasks:
          - key: m2-pty-spawn
            title: "Spawn the user's shell in a PTY"
            body: |
              `Effect::Terminal(TerminalOp::Spawn)` carries a `TerminalId`, cwd, extra env and size. It runs on a blocking thread, because forking takes 10-70 ms, and its success or failure comes back as a message. The default command is `$SHELL` as a login shell (`CommandBuilder::new_default_prog`).

              A reader thread reads up to 64 KB at a time and sends each batch as `Msg::TerminalOutput` on the terminal's own bounded channel, a few batches deep. A foreground task drains that channel into the core, so a flood stalls only its own producer, not other services. A wait thread sends `Msg::TerminalExited` with the real exit status on the same channel. Exit comes from `child.wait()`, not from the end of output, because background jobs can keep the PTY open.

              Env: `TERM=xterm-256color`, `COLORTERM=truecolor`, `TERM_PROGRAM=aiditor`, `TERM_PROGRAM_VERSION`; `LANG=en_US.UTF-8` when unset (apps launched from the macOS Dock have none); `SHLVL` removed. Set `IUTF8` on the PTY, which Linux leaves off. The core ignores terminal messages until the emulator epic.
            acceptance:
              - "Service tests use `/bin/sh -c` scripts and run on macOS and Linux: output arrives in order, the exit code arrives after it, and a spawn failure is reported"
              - "A consumer that never drains blocks the producer once the terminal's channel is full, while a file service reply still reaches the core"
              - "The default command starts `$SHELL` as a login shell (argv0 `-zsh` or `-bash`)"
              - "`stty -a` in the terminal lists `iutf8`"
              - "docs/editor.md records per-terminal channels under Output floods, the terminal env, and that bash login shells read `.bash_profile`/`.profile`, not `.bashrc`"
          - key: m2-pty-input
            title: "Terminal input and resize"
            body: |
              `TerminalOp::Write` hands bytes to a per-terminal writer thread, so a large paste into a program that isn't reading never blocks the UI. `TerminalOp::Resize` sets the PTY's rows and columns.
            acceptance:
              - "Bytes written to `cat` echo back"
              - "After a resize, `stty size` reports the new size"
              - "Writing `\\x03` interrupts a running `sleep`"
              - "In canonical mode, Backspace deletes a whole multibyte character"
              - "A write larger than the PTY buffer, to a program that doesn't read, returns at once"
            blocked_by: [m2-pty-spawn]
          - key: m2-pty-kill
            title: "Kill terminals and leave no shells behind"
            body: |
              `TerminalOp::Kill` sends SIGHUP, then SIGTERM, to the shell's process group, and SIGKILL after 100 ms. Dropping the master alone doesn't hang up the shell, because the reader thread holds a duplicate of it. When the app quits, every live terminal is killed before the process exits. Asking before killing a live terminal is the emulator epic's job, since it belongs to terminal buffers.
            acceptance:
              - "After Kill, the shell and its foreground job (`sleep 1000`) are gone"
              - "A shell that traps SIGHUP and SIGTERM is gone after the SIGKILL"
              - "Quitting the app leaves no shell processes behind"
            blocked_by: [m2-pty-spawn]
      - key: m2-emulator
        title: "Terminal buffers: emulator in the core"
        labels: [terminal, frontend]
        design: "#output-floods"
        body: |
          `alacritty_terminal` grid owned by the core as a buffer content backend; rendering of colours, cursor shapes and wide characters; one redraw per frame. Includes the flood check from the design doc (`yes` in one terminal while typing in another). Typing into a terminal is char mode's job (#88).
        tasks:
          - key: m2-term-grid
            title: "Terminal grid in the core"
            body: |
              Add `alacritty_terminal` to aiditor-core behind a small terminal interface, so the emulator can move off the UI thread later (see Output floods). A terminal buffer's content is a second `Content` variant holding the grid; it is read-only and its `text()` is an empty rope, so rope commands run in it harmlessly until copy mode builds text from the scrollback.

              The core maps each `TerminalId` to its buffer and feeds `Msg::TerminalOutput` into the grid. Replies the emulator writes back (cursor position and device attribute reports) go out as `TerminalOp::Write`, or `vim` and `fzf` hang waiting for them. Title, bell and clipboard requests are ignored. No command or rendering yet: tests create terminals through the core.
            acceptance:
              - "Feeding bytes into a terminal buffer's grid and snapshotting its screen text shows what a real terminal would, including cursor moves, clears and scrolling"
              - "`\\x1b[6n` in the output is answered with a `TerminalOp::Write` of the cursor position"
              - "Rope commands in a terminal buffer (motion, `C-x h`, swiper) don't panic, and edits fail as in any read-only buffer"
              - "Output for an unknown terminal is ignored"
          - key: m2-term-buffers
            title: "Open, resize and kill terminal buffers"
            body: |
              `vterm` (through `M-x`) spawns the user's shell in a new terminal buffer of the current workspace and shows it in the selected window. The working directory is the current buffer's file's directory, or the workspace project's primary root. Buffers are named `vterm<n><workspace>`, `n` the smallest number no buffer of that name has, so indexes count within a workspace and names stay unique across workspaces; they can be renamed like any buffer.

              The terminal's size follows the smallest window showing it, as Emacs's `window-adjust-process-window-size-smallest`: rows and columns from the window's text area and the cell size, sent as `TerminalOp::Resize` when they change. When the shell exits, its buffer is killed, as vterm's `vterm-kill-buffer-on-exit`. A spawn failure kills the buffer and shows the reason in the echo area.

              Killing a live terminal asks first, as Emacs's process query: `kill-buffer` asks `Buffer <name> has a running process; kill it? `, and quitting asks `Active processes exist; kill them and exit anyway? ` after the modified-buffer questions. Killing a workspace kills its terminals.
            acceptance:
              - "`M-x vterm` twice in workspace `work` makes `vterm1<work>` and `vterm2<work>`; the first in workspace `fix` is `vterm1<fix>`"
              - "The shell starts in the current file's directory, or the project's primary root from a buffer with no file"
              - "Splitting or resizing a window showing a terminal resizes its PTY to the smallest such window"
              - "`exit` in the shell kills its buffer"
              - "`kill-buffer` on a live terminal asks, and only yes kills it and its shell"
              - "Quitting with a live terminal asks, and no keeps the editor open with the terminal running"
              - "Killing a workspace leaves none of its shells behind"
            blocked_by: [m2-term-grid]
          - key: m2-term-render
            title: "Render the terminal grid"
            body: |
              Draw a terminal buffer's screen in its windows. Cells are placed at column × cell width, as Zed's terminal element does, so wide chars and glyphs from fallback fonts stay on the grid instead of shifting the rest of the row. The window shows the live screen; reading scrollback is copy mode's job (#88).
            acceptance:
              - "The 16 ANSI colours come from the theme; 256-colour and truecolor cells show their exact colour; default fg and bg are the theme's"
              - "Bold, italic, underline, dim and inverse cells are drawn as such"
              - "The cursor is a block, beam or underline as the program sets it (DECSCUSR), hidden when it hides it, and hollow in a window that isn't selected"
              - "A wide char (`日本`) takes two cells, and the chars after it line up with the row below"
              - "`htop` or `vim` in a terminal (started from the command line, since typing is char mode's job) draws correctly on macOS and Linux"
            blocked_by: [m2-term-grid]
          - key: m2-term-flood
            title: "Check typing during a terminal flood"
            body: |
              The design doc's flood check: with the emulator in the core, VT parsing runs on the UI thread. Run `yes`, and `cat` of a large file, in one terminal while typing in a file buffer in another window, and measure key handling and frame time with the debug timings. GPUI should still draw once per frame however many output batches arrive.
            acceptance:
              - "Typing during the flood shows no visible lag on macOS and Linux, with the measured times recorded in docs/editor.md under Output floods"
              - "If it lags, a follow-up task to move the emulator into the terminal task is added to the roadmap"
            blocked_by: [m2-term-buffers, m2-term-render]
          - key: m2-term-emoji
            title: "Draw colour emoji"
            labels: [frontend, linux]
            body: |
              A starship prompt's 🦀 isn't drawn in a terminal on Fedora, whose only colour emoji font is the COLRv1 `Noto-COLRv1.ttf`. Find whether text buffers miss it too (font fallback app-wide) or only the terminal painter does, and whether GPUI's Linux text system can draw COLRv1 glyphs; then draw emoji, two cells wide in terminals, falling back to a monochrome emoji font when colour glyphs can't be drawn.
            acceptance:
              - "🦀 shows in a terminal and in a text buffer on Linux and macOS"
              - "In a terminal, the emoji takes two cells and the rest of the row stays on the grid"
            blocked_by: [m2-term-render]
      - key: m2-modes
        title: "Char mode and copy mode"
        labels: [terminal, keymap]
        design: "#subsystems"
        body: |
          Char mode sends almost every key to the shell; copy mode turns scrollback into a read-only buffer with Emacs motion, search and kill.
        tasks:
          - key: m2-decide-escape
            title: "Decide: escape prefix key in char mode"
            labels: [decision]
            design: "#open-questions"
            body: |
              Which key stays with the editor in char mode, given readline's use of `C-a`, `C-e`, `C-x` and friends. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
          - key: m2-char-mode
            title: "Type into terminals in char mode"
            body: |
              A terminal buffer starts in char mode, as vterm-mode: every key except `C-x`, `C-c`, `M-x` and Cmd keys (#89) is encoded as xterm does and sent as `TerminalOp::Write` instead of running a command; those keys and the sequences under them go through the keymaps as usual, and `C-c C-c` sends `^C`. Encoding follows Zed's `terminal/src/mappings/keys.rs`: chars as UTF-8, `C-<letter>` as its control byte, `M-` as an ESC prefix, `RET` as `\r`, `DEL` as `\x7f`, `S-TAB` as `\x1b[Z`, arrows, Home and End in normal or application cursor mode (DECCKM) as the program set it, and modified arrows as `\x1b[1;<m>D` and friends. `Key` gains the keys a shell needs that it lacks: Home, End, PageUp, PageDown, Delete and F1 to F12. Text from the platform's input (Option-typed chars on macOS with `option_as_meta` off, IME commits) is sent the same way.
            acceptance:
              - "Typing `echo hi` then `RET` in a terminal runs it"
              - "`C-a`, `C-e`, `C-r` and `M-b` reach readline in bash and zle in zsh"
              - "Arrows move in `less` and `vim`, which switch to application cursor mode"
              - "`C-x b`, `C-c` sequences and `M-x` still run editor commands, and `C-g` and `C-u` reach the shell"
              - "`C-c C-c` interrupts a running `sleep 10`"
              - "Core tests check the bytes each key sends, in both cursor modes"
            blocked_by: [m2-decide-escape]
          - key: m2-term-paste
            title: "Paste into terminals"
            body: |
              In char mode, `s-v` (and `C-y` if #89 keeps it with the editor) sends the clipboard text, or the newest kill, to the shell instead of inserting it. When the program turned on bracketed paste (mode 2004), the text goes between `\x1b[200~` and `\x1b[201~` with every ESC removed, as Zed does, so a pasted multi-line command isn't run line by line and can't end the paste early.
            acceptance:
              - "`s-v` at a shell prompt pastes the clipboard"
              - "Two pasted lines in bash or zsh stay at the prompt, unrun"
              - "Without bracketed paste (into `cat`), the text is sent as is"
              - "A bracketed paste carries no ESC from the pasted text"
            blocked_by: [m2-char-mode]
          - key: m2-copy-mode
            title: "Copy mode over the scrollback"
            body: |
              A key under the escape prefix (#89) toggles copy mode, as vterm's `vterm-copy-mode`. Entering builds the buffer's text from the scrollback and the screen, joining the rows the terminal soft-wrapped so a long command is one line, and puts point at the terminal's cursor. The window then draws that text like any read-only buffer, so motion, the mark, swiper and `M-w` work unchanged. Output keeps feeding the grid, but the text stays as it was on entry. `RET` copies the region, or the current line without one, to the kill ring and the clipboard and leaves, as `vterm-copy-mode-done`; the toggle key leaves without copying. Leaving empties the text and shows the live screen again. On the alternate screen (`vim`, `less`) there is no scrollback, so the text is the screen.
            acceptance:
              - "After `seq 1 5000`, copy mode's text is the scrollback then the screen, with point at the shell's cursor"
              - "A command wider than the window is one line in copy mode"
              - "`M-<`, swiper and `C-SPC` … `M-w` work in copy mode, and inserting fails as in any read-only buffer"
              - "`RET` copies the region, or the current line without one, to the kill ring and clipboard, and returns to char mode on the live screen"
              - "Output in copy mode doesn't change its text or point, and shows once copy mode ends"
            blocked_by: [m2-decide-escape]
      - key: m2-shell-integration
        title: "Shell integration: OSC 133 and OSC 7"
        labels: [terminal]
        design: "#subsystems"
        body: |
          Prompt marks for jump-to-prompt and per-command output capture; cwd tracking.
        tasks:
          - key: m2-osc-parse
            title: "Prompt marks and cwd from terminal output"
            body: |
              alacritty_terminal drops OSC 133 and OSC 7 (vte's `osc_dispatch` sends them to `unhandled`). `Terminal::feed` runs vte's low-level `Parser` (re-exported as `alacritty_terminal::vte`) alongside, using `advance_until_terminated` to split the batch after each OSC 133 or OSC 7, feeds alacritty that prefix, then records the event at the cursor. Marks `A` (prompt), `B` (input), `C` (output) and `D` (end, with its exit code) are kept as absolute lines (history plus cursor line). OSC 7's `file://host/path` (and `kitty-shell-cwd://`) is percent-decoded and kept as the terminal's cwd when the host is empty, `localhost` or this machine and the path is absolute; anything else is ignored, since program output is untrusted. Marks are ignored on the alternate screen and dropped when the scrollback is cleared. Once the scrollback reaches its cap, alacritty no longer counts dropped lines, so stored lines would point at the wrong rows: stop keeping marks then (a `shortcut:` comment), as Zed's terminal gives up on its cwd history.
            acceptance:
              - "Core tests feed raw bytes with OSC 133 A/B/C/D and read back each mark's line and the exit code"
              - "OSC 7 with a local host sets the cwd; a remote host, a relative path or garbage leaves it unchanged"
              - "Marks set on the alternate screen are ignored, and `clear` (ED 3) drops them"
              - "A 64 KB batch with no OSC parses in about the same time as before (core benchmark)"
          - key: m2-osc-cwd
            title: "Terminal buffers follow the shell's directory"
            body: |
              A terminal buffer's directory is the last OSC 7 cwd, else the directory its shell started in. `Core::directory()` uses it, so `C-x C-f` from a terminal starts where the shell is, and `vterm` from a terminal buffer starts its shell there too.
            acceptance:
              - "After `cd /tmp` in a terminal, `C-x C-f` starts at `/tmp/`"
              - "`vterm` from that terminal starts its shell in `/tmp`"
              - "Without OSC 7, both use the directory the shell started in"
            blocked_by: [m2-osc-parse]
          - key: m2-osc-jump
            title: "Jump between prompts in copy mode"
            body: |
              In copy mode, `C-c C-p` (`vterm-previous-prompt`) and `C-c C-n` (`vterm-next-prompt`) move point to the start of the previous or next command's input (mark `B`, else `A`), as vterm does, honouring the prefix count. Copy mode maps each mark's grid line to its buffer line, accounting for soft-wrapped rows joined into one line. No marks: echo that no prompt was found.
            acceptance:
              - "After three commands, `C-c C-p` three times lands on each command's input, newest first, and `C-c C-n` goes back"
              - "`C-u 2 C-c C-p` skips one prompt"
              - "Core tests cover a wrapped command line and a terminal with no marks"
            blocked_by: [m2-osc-parse]
          - key: m2-osc-output
            title: "Select a command's output in copy mode"
            body: |
              In copy mode, a command (`vterm-mark-output`, bound under `C-c`) sets the region to the output of the command at point: from its `C` mark to its `D` mark, or to the next prompt when `D` is missing. `RET` then copies it as usual.
            acceptance:
              - "With point on `cargo test`'s output or its command line, the command then `RET` copies exactly that output"
              - "The last command, still running or with no `D`, is selected up to the screen's end"
              - "Without marks, it echoes that no command is at point"
            blocked_by: [m2-osc-parse]
          - key: m2-zsh-integration
            title: "Inject zsh shell integration"
            body: |
              zsh and starship send neither sequence, and Ghostty's integration only loads in shells Ghostty starts. When the shell is zsh, the PTY service starts it with `ZDOTDIR` set to a folder aiditor ships, as Ghostty does: its `.zshenv` restores the user's `ZDOTDIR` and sources their files, then adds hooks that send `133;D;<status>`, `133;A` and `7` before each prompt, `133;B` after it, and `133;C` before a command runs. The hooks run after starship's and add `B` once per prompt. Other shells get nothing (a `shortcut:` comment). Record the decision in `docs/editor.md`.
            acceptance:
              - "A zsh terminal sends OSC 133 A/B/C/D and OSC 7, with the user's `.zshenv`, `.zshrc` and starship prompt unchanged"
              - "Inside it, `$ZDOTDIR` is the user's own value, so nested shells behave as outside aiditor"
              - "Bash and fish start as before"
              - "Checked on macOS and Linux"
              - "Decision recorded in docs/editor.md"

  # ───────────────────────────────────────────── M3 ─────────────────────────────────────────────
  - key: m3
    title: "M3 · First agent"
    description: "Claude Code via ACP, session buffer and modes, process environment, agent command output in the session buffer."
    gate: "Land one real change with an agent, in the editor."
    epics:
      - key: m3-env
        title: "Process environment capture"
        labels: [core, macos, linux]
        design: "#subsystems"
        body: |
          Inherit the environment when launched from a shell; otherwise capture it per project with an interactive login shell in the primary repo, with a marker, a timeout and a fallback; env overrides from the agent registry and project file; a re-capture command. Break down when M3 starts.
        tasks:
          - key: m3-env-bundle
            title: "Bundle as a macOS app and a Linux desktop entry"
            labels: [infra]
            body: |
              A script builds `aiditor.app`: Info.plist with a bundle id and name, a placeholder icon, the release binary in `Contents/MacOS`, ad-hoc signed. On Linux it installs a `.desktop` file and icon under `~/.local/share`. `aiditor .` from a shell still runs the binary directly. A Dock or launcher start gets launchd's minimal environment, which the rest of this epic fixes. The bundle id is what system notifications (agent finished, permission needed) need later. No notarization: it's built locally.
            acceptance:
              - "aiditor launches from the Dock and Spotlight with its name and icon in Cmd-Tab"
              - "aiditor launches from the desktop launcher on Linux"
              - "How to build and install the bundle is recorded in docs/editor.md"
          - key: m3-env-decide
            title: "Decide: process environment capture details"
            labels: [decision]
            body: |
              Settle what the spec leaves open, using Zed's `util/src/shell_env.rs` and `project/src/environment.rs` as prior art:
              - Launch detection: stdout is a terminal (Zed's check) or something else.
              - What prints the environment: `env -0`, or `aiditor --print-env` redirected to fd 0 as Zed does, so profile output can't mix with it.
              - Capture once per project on first use, or eagerly when a project opens, with spawns waiting for it.
              - Override order: captured < agent registry < project file, or registry last.
              - direnv and `mise activate` hook into the prompt, which `-c` never draws, so "running it in the project's directory also picks up direnv" is wrong. Fix the wording; direnv is loaded by its own task.
            acceptance:
              - "Answers recorded in docs/editor.md under Process environment"
          - key: m3-env-capture
            title: "Capture the login shell environment per project"
            body: |
              When not launched from a shell, run `$SHELL -l -i -c` in the project's primary repo off the UI thread: new session (`setsid`), stdin closed to the shell's input, the printer and launch check as decided. Parse only the printed environment, even if the shell exits non-zero; drop `SHLVL`; fish gets `emit fish_prompt` first. Give up after a few seconds, killing the process group, and fall back to the app's environment with a note in the Messages buffer. Keep the result per project for the session. A command re-captures it for new processes. Tests use a fake `$SHELL` script that prints noise, hangs or fails.
            acceptance:
              - "Launched from the Dock, a project's captured environment has the PATH an interactive login shell in its primary repo has"
              - "Launched from a shell, nothing is captured and the inherited environment is used"
              - "A hanging or failing shell falls back within the timeout with a note in Messages"
              - "The re-capture command picks up a changed shell profile"
            blocked_by: [m3-env-bundle, m3-env-decide]
          - key: m3-env-project-overrides
            title: "Project file env overrides"
            labels: [project]
            body: |
              An optional `env` table in the project file, set on top of the captured (or inherited) environment in the order decided. The agent registry's `env` is merged by the registry epic, in the same order.
            acceptance:
              - "A variable set in the project file reaches processes started for that project"
              - "A bad `env` value is reported like any other project file error and the rest still loads"
            blocked_by: [m3-env-capture]
          - key: m3-env-direnv
            title: "Load direnv into the captured environment"
            body: |
              After capturing, if `direnv` is on the captured PATH, run `direnv export json` in the primary repo with the captured environment and apply its result, as Zed does. A failure (`.envrc` not allowed, bad output) keeps the captured environment and notes it in the Messages buffer.
            acceptance:
              - "A project whose primary repo has an allowed `.envrc` gets its variables"
              - "A blocked `.envrc` leaves the captured environment unchanged with a note in Messages"
            blocked_by: [m3-env-capture]
      - key: m3-acp-client
        title: "Agent registry and ACP client"
        labels: [acp]
        design: "#acp-integration-and-session-management"
        body: |
          Agent registry in TOML; one process per session with stderr to a log buffer; `initialize` and `session/new` with `cwd` set to the primary repo (additional directories come in M4); no fs capabilities advertised. Break down when M3 starts.
        tasks:
          - key: m3-spike-acp
            title: "Spike: ACP crate threading"
            labels: [spike]
            body: |
              Time-box: 1 day. Are the `agent-client-protocol` crate's connection types `!Send`? Decide whether the ACP client runs on GPUI's foreground executor or a dedicated single-threaded runtime, and record it in `docs/editor.md`. Cheap enough to do any time before M3.
            acceptance:
              - "Answer and choice recorded in docs/editor.md"
          - key: m3-acp-registry
            title: "Agent registry in settings"
            labels: [core]
            body: |
              An `[agents.<name>]` table in settings.toml: `command`, `args`, `env`, `default_mode`, merged like any other setting. The bundled settings define `claude` (claude-agent-acp). A bad entry is reported like any other settings error. A project file's `default_agent` that names no registered agent is reported like any other project file error.
            acceptance:
              - "The bundled registry has a claude entry; a user entry overrides or adds agents"
              - "An unknown `default_agent` is reported as `project <file>: <reason>` and the rest of the file still loads"
              - "Decision recorded in docs/editor.md"
          - key: m3-acp-service
            title: "ACP service: spawn an agent and open a session"
            labels: [infra]
            body: |
              `aiditor-services/src/agents.rs`, on the runtime the spike decides. The core depends on `agent-client-protocol-schema`, and `Msg` and `Effect` carry its types as they are. On `AgentOp::Spawn` the service starts the command in the primary repo with the captured env, the registry's `env` on top, then the project file's `env`. It sends `initialize` advertising no fs or terminal capabilities, then `session/new` with `cwd`, and answers with `Msg::AgentStarted` (session id, modes) or a failure. Stderr lines and the exit come back as messages. Agent-to-client requests are kept by request id so a later `AgentOp::Reply` can answer them; until the modes epic they're rejected. Kill and kill-all follow `Terminals`. Tests run a minimal agent built on the ACP crate, which the fake agent epic grows into the scripted fake.
            acceptance:
              - "A test agent is initialized and a session is opened with `cwd` set to the primary repo and no fs capabilities"
              - "The agent's stderr and exit arrive as messages; a spawn failure is reported, not panicked on"
              - "Kill and quit leave no agent process behind"
            blocked_by: [m3-spike-acp, m3-acp-registry]
          - key: m3-acp-sessions
            title: "Start an agent session from the editor"
            body: |
              A command starts an agent session in the current workspace: it takes an agent name, with completion over the registry, and defaults to the project's `default_agent`. While the project's environment is being captured, the spawn waits for the answer. Each session gets a read-only stderr log buffer. Messages notes `<agent> session ready (modes: ...)`, a failure, or a crash, and a crash ends only that session. Killing a workspace or quitting stops its agents, and quitting asks about them as it asks about terminals. Session updates are kept for the session buffer and not rendered.
            acceptance:
              - "Starting claude from the Dock waits for the capture and finds `claude-agent-acp` on the captured PATH"
              - "The log buffer shows the agent's stderr; Messages shows ready with its modes"
              - "A crashing agent ends its own session only, with a note in Messages"
              - "Checked against the real claude-agent-acp on macOS and Linux"
            blocked_by: [m3-acp-service]
      - key: m3-fake-agent
        title: "Fake agent and transcript replay tests"
        labels: [acp, infra]
        design: "#testing"
        body: |
          A fake agent built on the ACP crate, scripted to stream updates, request permissions, write files to disk and create terminals; recorded Claude Code and Codex transcripts replayed against the client. Break down when M3 starts.
        tasks:
          - key: m3-fake-script
            title: "Scripted fake agent"
            body: |
              Grow `aiditor-test-agent` into the fake: instead of `AIDITOR_TEST_AGENT` behaviors, `AIDITOR_FAKE_AGENT` names a script file of steps to run after `session/new` and on each `session/prompt`. Steps: send a `session/update` (written as ACP JSON, so any update the schema has needs no new code), ask a permission and wait for the answer, write a file relative to `cwd` on disk, sleep, write to stderr, exit with a code, and end the turn with a stop reason. It answers `session/set_mode` with a `current_mode_update` and stops the turn on `session/cancel`. Record the script format in `docs/editor.md` under Testing. Creating terminals is added by the agent terminals epic if #100 finds the adapters use it. Port the agent service tests to scripts.
            acceptance:
              - "The agent service tests run against scripts and the `AIDITOR_TEST_AGENT` behaviors are gone"
              - "A script streams updates, asks a permission, writes a file and ends a turn"
              - "Script format recorded in docs/editor.md"
          - key: m3-fake-record
            title: "Record Claude Code and Codex ACP transcripts"
            body: |
              A small `aiditor-acp-record OUT -- COMMAND ARGS` binary that runs the agent, passes stdio through and appends every JSON-RPC line with its direction to OUT as JSON lines. Put it in front of `claude-agent-acp` or `codex-acp` with a registry entry. Record a short session with each agent from aiditor, so the client capabilities are ours: a reply with markdown, a tool call that reads, one that edits a file, a permission prompt and a mode change. Scrub them before committing: home directory and `cwd` become placeholders, and nothing secret is left (tokens, emails, private paths). Commit them under `crates/aiditor-services/tests/transcripts/` with how to re-record. Needs prompting from #292.
            acceptance:
              - "The recorder passes traffic through unchanged and writes both directions"
              - "A scrubbed Claude Code and a scrubbed Codex transcript are committed"
              - "How to record and scrub is written next to them"
            blocked_by: [m3-acp-sessions, m3-session-prompt]
          - key: m3-fake-replay
            title: "Replay recorded transcripts against the client"
            body: |
              A replay mode of the fake agent: given a transcript, it answers each client message with the agent messages recorded after it, matching by method and remapping request ids, puts the real `cwd` back in place of the placeholder, and exits with an error on a client message the transcript doesn't expect. A test replays every committed transcript through the agent service into the core and asserts that every update reaches the core typed, every agent request is answered, and the turn ends. Later epics add their own assertions (a snapshot of the session buffer, permission answers) to the same test.
            acceptance:
              - "Every committed transcript replays to the end under `cargo test` on macOS and Linux"
              - "An unexpected client message fails the test with the message shown"
            blocked_by: [m3-fake-script, m3-fake-record]
          - key: m3-fake-scenario
            title: "Whole-app scenario with the fake agent"
            body: |
              One end-to-end test of the core with the real services, as `tests/file_sync.rs` does for files: a temporary project whose registry points at the fake agent, a key script that runs `agent-start` and sends a prompt, and a fake script that streams a reply and writes a file the project has open. It asserts that the reply reaches the session, the open buffer reverts to the new contents, and killing the workspace leaves no agent process. Needs prompting from #292.
            acceptance:
              - "The scenario passes under `cargo test` on macOS and Linux"
            blocked_by: [m3-fake-script, m3-session-prompt]
      - key: m3-soft-wrap
        title: "Soft wrap"
        labels: [text, frontend]
        design: "#core-data-model"
        body: |
          Soft wrap as decided in #45: visual lines in the display builder, for vertical motion and for scrolling. File buffers wrap by default, Markdown and text at word boundaries (`visual-line-mode`), code at the window edge with a continuation marker; `toggle-truncate-lines` switches a buffer back to truncation with horizontal scroll. Pulled forward from M5 for the session buffer.
        tasks:
          - key: m3-wrap-display
            title: "Wrap long lines in the display"
            body: |
              The display builder splits a long line into visual lines at the window's width: Markdown, text and session buffers at word boundaries, other buffers at the window edge with a continuation marker. Scrolling and point's visibility count visual lines. Wrapping is on by default; `toggle-truncate-lines` switches a buffer back to truncation with horizontal scroll. Only the lines on screen are wrapped, so a long file costs no more than now.
            acceptance:
              - "Long lines wrap at word boundaries in Markdown and session buffers, at the edge with a marker in code"
              - "Scrolling keeps point visible on wrapped lines"
              - "`toggle-truncate-lines` switches between wrapping and truncation"
          - key: m3-wrap-motion
            title: "Move by visual lines in wrapped buffers"
            body: |
              `C-n` and `C-p` move by visual lines and keep the goal column within the visual line, as Emacs's `line-move-visual`; `C-a`, `C-e` and `C-k` keep acting on logical lines, as in Emacs without `visual-line-mode`'s rebinds.
            acceptance:
              - "`C-n` and `C-p` step through a wrapped line one visual line at a time"
            blocked_by: [m3-wrap-display]
      - key: m3-session-buffer
        title: "Session buffer"
        labels: [acp, frontend]
        design: "#acp-integration-and-session-management"
        body: |
          A rope buffer the core renders the transcript into: markdown with hidden markup, folded tool calls, read-only text above a comint-style prompt, as decided in M0 ("Decide: display model for the session buffer"). Soft wrap is pulled forward into M3.
        tasks:
          - key: m3-session-prompt
            title: "Session buffer with a prompt"
            body: |
              `agent-start` opens and shows a `*<agent>*<<workspace>>` session buffer, which becomes the session's handle in place of the stderr log buffer: killing it (asked first while the agent is live) or its workspace stops the agent. As in comint, everything before the prompt marker is read-only and output is inserted above it. `RET` in the prompt area sends the input as a `session/prompt` and echoes it above the marker; `C-j` and `S-RET` insert a newline. `RET` while a turn runs echoes that the agent is busy. `C-c C-c` sends `session/cancel`. Agent message chunks are appended as plain text as they stream; a turn that ends other than `end_turn`, or an error reply, gets a line saying so. Other updates stay kept and unrendered until the tasks below. Tests drive the scripted fake agent.
            acceptance:
              - "A prompt sent to the fake agent shows its streamed reply above the prompt, and the turn ends"
              - "Text above the prompt marker is read-only; the prompt area edits like any buffer"
              - "`C-c C-c` ends a running turn as cancelled"
              - "Killing the session buffer or its workspace leaves no agent process"
              - "Keys and behaviour recorded in docs/editor.md"
            blocked_by: [m3-acp-sessions, m3-fake-script]
          - key: m3-session-markdown
            title: "Render agent messages as markdown"
            body: |
              Render each agent message, user prompt and thought into the rope as markdown text with properties, as the display model decided: faces for headings, emphasis, inline code and links; the markup itself `invisible`; a line background on code blocks; thoughts in a dim face. The markup stays in the text, so swiper matches it and kill or copy yield markdown. Only the message being streamed is re-rendered, at most once per frame.
            acceptance:
              - "Headings, emphasis, inline code, links and code blocks render with their markup hidden"
              - "Swiper finds hidden markup; `M-w` over a message yields its markdown"
              - "Streaming a long reply re-renders only that message, at most once per frame"
            blocked_by: [m3-session-prompt, m3-wrap-display]
          - key: m3-session-tools
            title: "Show tool calls folded in the session buffer"
            body: |
              Each `tool_call` gets a header line (title, kind, status) with a rule beside it and its content (input, output, text) folded under it as `invisible` text. `tool_call_update` updates the header and content in place. `TAB` on a header toggles its fold, as in magit.
            acceptance:
              - "A tool call shows folded with its status, and updates in place as it runs and finishes"
              - "`TAB` on its header shows and hides its content"
            blocked_by: [m3-session-markdown]
          - key: m3-session-plan
            title: "Show the agent's plan and mode in the session buffer"
            body: |
              A `plan` update renders the plan's entries with their status and priority, replacing the previous plan in place. The session buffer's mode line shows the current mode, following `current_mode_update`; cycling modes belongs to the modes epic.
            acceptance:
              - "A new plan replaces the old one in place"
              - "The mode line shows the current mode and follows mode changes"
            blocked_by: [m3-session-prompt]
      - key: m3-modes
        title: "Session modes and permission prompts"
        labels: [acp]
        design: "#acp-integration-and-session-management"
        body: |
          Default mode per agent from config, a key to cycle modes, permission requests answered inline in the session buffer. Break down when M3 starts.
        tasks:
          - key: m3-modes-config
            title: "Session mode from config options, started in default_mode"
            body: |
              Take the session's mode from ACP session config options instead of session modes: the mode is the first option in `session/new`'s `configOptions` with category `mode`, and an agent without one has no mode (both adapters send one; Codex's plan mode and model picking exist only as config options, so they become one more `configId` later). The mode line and the `session ready (modes: ...)` message read that option and follow `config_option_update` instead of `current_mode_update`. After `session/new`, if the agent's `default_mode` is one of the option's values and not the current one, the core sends `session/set_config_option` through a new `AgentOp`; an unknown value is noted in `*Messages*` and the session stays as it is. The fake agent advertises a `mode` option (`auto`, `plan`), answers `session/set_config_option` and sends `config_option_update`. Record config options over modes, and why, in docs/editor.md.
            acceptance:
              - "A session whose agent has `default_mode` set starts in that mode, shown in the mode line"
              - "An unknown `default_mode` is noted in `*Messages*` and leaves the mode alone"
              - "The mode line follows `config_option_update`"
              - "Config options over modes, and why, recorded in docs/editor.md"
            blocked_by: [m3-session-plan]
          - key: m3-modes-cycle
            title: "Cycle the session's mode with S-TAB"
            body: |
              `agent-cycle-mode`, bound to `S-TAB` in `agent-session-mode` (Claude Code's shift-tab), sets the mode option to the next of all its values, wrapping around, with `session/set_config_option`. It echoes `<agent> has no modes` for an agent without a mode option, and the usual not ready or ended message before `session/new` is answered or after an exit.
            acceptance:
              - "`S-TAB` moves the fake agent's session through every mode and back, and the mode line follows"
              - "Keys and behaviour recorded in docs/editor.md"
            blocked_by: [m3-modes-config]
          - key: m3-permission-prompt
            title: "Answer permission requests inline in the session buffer"
            body: |
              Replace the refusal of `session/request_permission` with a prompt: a block above the prompt line with the tool call's title and a numbered line per option (its name and `dim` kind). `C-c C-y` answers the oldest pending request with its first `allow_once` option and `C-c C-n` with its first `reject_once` option, from anywhere in the buffer; `RET` on an option line picks that option. Answered, the block becomes one line saying what was chosen and for which tool. Several requests can be pending at once. Other agent requests are still refused. The transcript replay test asserts that each recorded permission request gets an answer.
            acceptance:
              - "A permission request from the fake agent shows inline, and `C-c C-y`, `C-c C-n` and `RET` on an option send the matching outcome"
              - "Two pending requests are answered oldest first"
              - "The replay test asserts the recorded permission requests are answered"
              - "Keys and behaviour recorded in docs/editor.md"
            blocked_by: [m3-session-prompt]
          - key: m3-permission-settle
            title: "Settle pending permission requests on cancel and exit"
            body: |
              ACP requires the client to answer pending permission requests with `Cancelled` after `session/cancel`. `C-c C-c` does so for every pending request of the session and marks their blocks cancelled; a request arriving after the session ended, or while its buffer is being killed, is answered `Cancelled` and not shown; an agent exit drops its pending requests.
            acceptance:
              - "`C-c C-c` during a pending permission request answers it `Cancelled` and ends the turn"
              - "No permission request is left unanswered while its agent lives"
            blocked_by: [m3-permission-prompt]
      - key: m3-command-output
        title: "Agent command output"
        labels: [acp, frontend]
        design: "#acp-integration-and-session-management"
        body: |
          Show the output of the shell commands an agent runs in its tool calls, from the `_meta` terminal extension both adapters use (#100): advertise `_meta.terminal_output`, collect output per terminal id, show the exit code, and colour the output from its ANSI escapes.
        tasks:
          - key: m3-command-output-show
            title: "Show agent command output in its tool call"
            body: |
              `initialize` advertises `clientCapabilities._meta.terminal_output: true`. The core collects output per terminal id: a `tool_call` with `_meta.terminal_info` or a `terminal` content item opens it, and every `tool_call_update` appends the `data` of `_meta.terminal_output` or `_meta.terminal_output_delta` (Codex streams chunks under both names; Claude sends one at the end). The tool call shows that output, ANSI escapes stripped, as its `Output:` block in place of the `Terminal <id>` line. `_meta.terminal_exit` puts a non-zero exit code or a signal in the header. A command streaming fast re-renders its tool call at most once per frame. Output for a terminal id no tool call announced is dropped. Tests drive the scripted fake agent with `_meta` updates.
            acceptance:
              - "Streamed chunks under either key show in the tool call's output as they arrive"
              - "A failing command shows its exit code in the tool call's header"
              - "Every committed transcript still replays; checked against the real claude-agent-acp on macOS and Linux"
            blocked_by: [m3-decide-terminal-create]
          - key: m3-command-output-ansi
            title: "Colour agent command output from its ANSI escapes"
            body: |
              Instead of stripping them, turn SGR escapes in command output into faces (the 16 colours from the theme, bold, underline, reset) and drop every other escape, so `cargo test` and `git diff` output keeps its colours. The escapes stay out of the buffer's text, so copying output yields plain text.
            acceptance:
              - "Coloured command output shows its colours; copying it yields text without escapes"
            blocked_by: [m3-command-output-show]
          - key: m3-decide-terminal-create
            title: "Check: do the adapters call terminal/create?"
            labels: [decision, acp]
            design: "#open-questions"
            body: |
              Check whether claude-agent-acp and codex-acp call `terminal/create` when the client advertises terminals. If neither does, drop this epic. Cheap enough to do any time before M3. Record the answer in `docs/editor.md`.
            acceptance:
              - "Answer recorded in docs/editor.md"

  # ───────────────────────────────────────────── M4 ─────────────────────────────────────────────
  - key: m4
    title: "M4 · Sessions"
    description: "Resume after restart via session/load, Claude and Codex side by side, extra roots, project preamble."
    gate: "One session makes a change across two repos."
    epics:
      - key: m4-index
        title: "List past sessions with session/list"
        labels: [acp]
        design: "#acp-integration-and-session-management"
        body: |
          The project's past sessions come from the agents themselves: `session/list` to each registry agent with the project's primary root as `cwd`, shown in a sessions buffer, most recently updated first. No index of our own; sessions started in the Claude Code CLI or the Codex app appear too.
        tasks:
          - key: m4-list-service
            title: "List an agent's sessions in a throwaway process"
            body: |
              A new `AgentOp::List` spawns the agent like `Spawn` (command, args, env, `cwd` the primary root), sends `initialize`, and, when the agent advertises `sessionCapabilities.list`, sends `session/list` with that `cwd`, following `nextCursor` up to a limit (a `shortcut:`). It then kills the process and answers `Msg::AgentListed` with the agent's sessions or an error (spawn failure, no list capability, an error answer, an exit). Each request carries an id so the core can drop answers to a superseded request. The fake agent answers `session/list` from a fixture.
            acceptance:
              - "A list request answers with every page of the fake agent's sessions, and its process exits"
              - "An agent without `sessionCapabilities.list`, or one that fails to start, answers with an error"
              - "Checked against the real claude-agent-acp and codex-acp on macOS"
          - key: m4-list-buffer
            title: "List the project's past sessions in a buffer"
            body: |
              `agent-sessions` (M-x) asks every registry agent for its sessions in the current workspace's project, after the project's environment is captured, and shows `*Sessions*<workspace>`: read-only, owned by the workspace, in `agent-sessions-mode`. Each row shows the agent, the last update in the local time zone, and the title. Rows are sorted by `updatedAt`, most recent first, across all agents; a missing or unparseable time sorts last and shows blank. Add a time crate (`jiff`) to parse `updatedAt` as RFC 3339, whatever offset or fraction an adapter sends, and show it in local time. While an agent hasn't answered, its line reads `Listing <agent>...`; an agent's error takes the place of its rows. Each answer rebuilds the list, keeping point on the same session. Sessions open in the editor are marked `[open]`. `g` asks every agent again and drops answers to the previous request, `n`/`p` move between rows and `q` quits. `RET` on an `[open]` row switches to its session buffer; loading the others is #103.
            acceptance:
              - "Sessions from two agents show in one list, most recently updated first"
              - "Times in `Z` and in other offsets, with and without fractions, show in the local time zone; a test passes a fixed zone"
              - "`g` rebuilds the list and a late answer to the previous request is dropped"
              - "`RET` on an `[open]` row switches to its session buffer"
            blocked_by: [m4-list-service]
          - key: m4-list-state
            title: "Show the state of open sessions in the session list"
            body: |
              Replace the `[open]` mark with the live session's state, known to the core without ACP: `[starting]` before `session/new` answers, `[working]` while a turn runs, `[waiting]` while a permission request is pending, `[idle]` between turns and `[ended]` once its process exited. The buffer updates the label when the state changes. Sessions running outside the editor show no state; ACP's `session/list` doesn't report one.
            acceptance:
              - "Each state shows its label, and the label follows the session's changes without `g`"
            blocked_by: [m4-list-buffer]
      - key: m4-resume
        title: "Resume sessions with session/load"
        labels: [acp]
        design: "#acp-integration-and-session-management"
        body: |
          `RET` on a session in the sessions buffer that isn't open in the editor continues it in the current workspace: `session/load` replays history into a new session buffer. Break down when M4 starts.
        tasks:
          - key: m4-spike-external-sessions
            title: "Spike: list sessions started outside the editor"
            labels: [spike]
            body: |
              Can the adapters list their own sessions (for example ones started in the Claude Code CLI) so the resume list can include them? Cheap enough to do any time before M4.
            acceptance:
              - "Answer recorded in docs/editor.md"
      - key: m4-codex
        title: "Codex adapter"
        labels: [acp]
        design: "#acp-integration-and-session-management"
        body: |
          Codex via codex-acp in the agent registry, with its modes; sessions with Claude Code and Codex side by side in one workspace. Break down when M4 starts.
      - key: m4-preamble
        title: "Additional directories and the roots preamble"
        labels: [acp, project]
        design: "#acp-integration-and-session-management"
        body: |
          Pass the project's other roots as `additionalDirectories`; the first prompt carries a preamble listing the roots and their role lines. Break down when M4 starts.
        tasks:
          - key: m4-preamble-roots
            title: "Pass the other roots and send the roots preamble"
            body: |
              `AgentOp::Spawn` carries the project's other roots beside `cwd`. When the agent advertises `sessionCapabilities.additionalDirectories`, the service sends them as `additionalDirectories` on `session/new` and on `session/load`; otherwise the session starts without them and `*Messages*` notes `<agent> can't take additional directories`. A new session's first prompt carries the preamble as a text block before the user's: each root's path with its role line, the primary marked as such. It is not shown in the session buffer, and is skipped when the project has no other roots and the primary has no role line. A loaded session gets no preamble: one started in the editor already has it in its history. Roots added or removed while a session runs apply from its next start or load. Record these decisions in docs/editor.md.
            acceptance:
              - "The fake agent receives the other roots on `session/new` and `session/load`, and none when it doesn't advertise the capability, with the note in `*Messages*`"
              - "The first prompt of a new session carries the preamble once; later prompts, loaded sessions and projects with nothing to list carry none"
              - "The session buffer shows only the user's text"
              - "One claude-agent-acp session changes files in two roots on macOS"

  # ───────────────────────────────────────────── M5 ─────────────────────────────────────────────
  - key: m5
    title: "M5 · Polish"
    description: "Tree-sitter for five languages, TAB indentation, formatters, registers, macros, navigation features, $EDITOR client for terminals."
    gate: "Daily driver for real work, without LSP (knowingly deferred)."
    epics:
      - key: m5-treesitter
        title: "Tree-sitter parsing service and highlighting"
        labels: [text]
        design: "#subsystems"
        body: |
          Incremental parsing for Elixir (with HEEx), Rust, JS/TS, YAML and Markdown; highlighting, folding and structural motion. Highlighting comes first, parsed on the core thread; moving parsing off it, inline Markdown, injections (code fences, `~H` sigils), folding and structural motion follow.
        tasks:
          - key: m5-highlight-js
            title: "Highlight JavaScript and TypeScript"
            body: |
              The highlighting pipeline, built for JS/TS first. Visiting a file picks its language by extension (`.js`, `.mjs`, `.cjs`, `.jsx`, `.ts`, `.mts`, `.cts`, `.tsx`) and parses it with `tree-sitter`; each edit is applied to the tree with `Tree::edit` and reparsed incrementally on the core thread (a `shortcut:` until parsing moves off it). The display builder runs the grammar's highlights query over the visible lines only and maps capture names (keyword, string, comment, function, type, constant, number, operator, property, variable.builtin, …) to faces from a `syntax` palette in the bundled theme; highlights are not stored as text properties. TypeScript's query extends JavaScript's, so both are combined, as Zed and Helix do.
            acceptance:
              - "JS, TS and TSX files open highlighted, and highlighting follows edits, undo and reverts"
              - "Only the visible lines are queried for highlights"
              - "The theme has a `syntax` palette that settings.toml can override"
              - "A test checks a snippet's faces"
          - key: m5-highlight-langs
            title: "Highlight Rust, Elixir, HEEx and YAML"
            body: |
              Add the grammars and their highlights queries to the pipeline: Rust (`.rs`), Elixir (`.ex`, `.exs`), HEEx (`.heex`) and YAML (`.yml`, `.yaml`). `~H` sigils inside Elixir files wait for injections.
            acceptance:
              - "Files in each language open highlighted"
            blocked_by: [m5-highlight-js]
          - key: m5-highlight-toml
            title: "Highlight TOML"
            body: |
              Add the TOML grammar and its highlights query to the pipeline for `.toml` files, so `Cargo.toml` and aiditor's own `settings.toml` open highlighted.
            acceptance:
              - "TOML files open highlighted"
            blocked_by: [m5-highlight-js]
          - key: m5-highlight-markdown
            title: "Highlight Markdown blocks"
            body: |
              Highlight `.md` files with `tree-sitter-md`'s block grammar: headings, code fences, lists, quotes and thematic breaks. Inline emphasis, code spans and links (the inline grammar) and code inside fences wait for injections.
            acceptance:
              - "Markdown files open with their block structure highlighted"
            blocked_by: [m5-highlight-js]
      - key: m5-treesitter-more
        title: "Tree-sitter injections and richer highlighting"
        labels: [text]
        design: "#subsystems"
        body: |
          What the highlighting pipeline left out: injected languages, locals, and bold and italic faces. Parsing moves off the core thread only if large files lag; folding and structural motion wait until after the MVP. Tasks are tracked as sub-issues.
        tasks:
          - key: m5-ts-markdown-inline
            title: "Highlight inline Markdown and code fences"
            body: |
              Injections in the pipeline, built for Markdown first: inline emphasis, code spans and links with `tree-sitter-md`'s inline grammar, and code fences in their info string's language (`rust`, `elixir`, `js`, `ts`, `yaml`, `toml`) with that grammar's highlights. Injected trees are parsed incrementally with their host's, and only the visible lines are queried.
            acceptance:
              - "Emphasis, code spans and links in Markdown are highlighted"
              - "A fenced Rust or Elixir block is highlighted as that language, and an unknown language stays plain"
              - "A test checks a fence's faces"
            blocked_by: [m5-highlight-markdown]
          - key: m5-ts-heex-sigils
            title: "Highlight HEEx in ~H sigils"
            body: |
              Use the injections pipeline for Elixir's `~H` sigils, highlighted with the HEEx grammar, and HEEx's own embedded Elixir expressions.
            acceptance:
              - "A `~H` sigil in an `.ex` file is highlighted as HEEx, with its `{}` and `<%= %>` expressions as Elixir"
            blocked_by: [m5-ts-markdown-inline]
          - key: m5-ts-locals
            title: "Highlight locals"
            body: |
              Run each grammar's `locals` query where it has one, so a parameter or local keeps its `variable.parameter` or definition colour where it is used, as Zed and Helix do.
            acceptance:
              - "A Rust function's parameter is coloured as a parameter at each use"
            blocked_by: [m5-highlight-langs]
          - key: m5-ts-font-styles
            title: "Bold and italic syntax faces"
            body: |
              Let `theme.syntax` entries carry bold and italic as well as a colour, in the form the theme decision chose, and draw them in the display builder.
            acceptance:
              - "A theme can make comments italic and keywords bold, and settings.toml can override either"
            blocked_by: [m5-decide-theme]
      - key: m5-indent
        title: "TAB indentation"
        labels: [text]
        design: "#commands-and-keymaps"
        body: |
          TAB indents the current line for the buffer's language. Break down after the decisions below.
        tasks:
          - key: m5-decide-indent
            title: "Decide: how indentation rules are defined"
            labels: [decision]
            design: "#open-questions"
            body: |
              Tree-sitter indent queries (as Helix does) or hand-written rules per language. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
          - key: m5-decide-settings
            title: "Decide: per-language and per-project settings"
            labels: [decision]
            design: "#open-questions"
            body: |
              Indent width and style per language and project, and `.editorconfig` support. Themes and fonts moved to "Decide: theme and font configuration". Per-project values come from the project file overriding the global files, VS Code style (see "Project overrides for settings and keymaps"); this settles how per-language values and `.editorconfig` fit into those layers. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
      - key: m5-files
        title: "File handling beyond UTF-8"
        labels: [files]
        design: "#core-data-model"
        body: |
          File handling that M0's rules left out. Break down when M5 starts.
        tasks:
          - key: m5-encodings
            title: "Open and save files in other encodings"
            body: |
              M0 opens only UTF-8 and refuses other files as binary (#45). Detect the encoding of a non-UTF-8 file with `encoding_rs` (Latin-1, Windows-1252, UTF-16 with a BOM), decode it into the buffer, show the encoding in the mode line, and write the file back in its original encoding.
            acceptance:
              - "A Latin-1 file opens, edits and saves back as Latin-1"
              - "A UTF-16 file with a BOM round-trips unchanged"
            blocked_by: [m0-file-io]
      - key: m5-minibuffer
        title: "Minibuffer polish"
        labels: [minibuffer]
        design: "#commands-and-keymaps"
        body: |
          Minibuffer and completion behaviour that M0 left out. Break down when M5 starts.
        tasks:
          - key: m5-minibuffer-height
            title: "Completion list keeps its height while the minibuffer is open"
            body: |
              The completion list shrinks and grows with the number of matches, so the windows above it jump while you type or move between directories in `find-file`. Make it grow only while one minibuffer is open (Emacs's `resize-mini-windows` = `grow-only`, Vertico's default): it keeps the most rows it has shown, padding with empty rows, and resets when the minibuffer closes.
            acceptance:
              - "In `find-file`, going from a directory with 10 entries to one with 5 keeps 10 rows (5 empty) and the windows above don't move"
              - "The next minibuffer starts at the height its own candidates need"
            blocked_by: [m0-find-file]
          - key: m5-find-file-listing
            title: "find-file lists files like Emacs"
            body: |
              Found in the M0 gate (#54). Make the `find-file` completion list read like Emacs with Vertico and marginalia: nothing is selected until a file is picked, so the count before the prompt reads `*/5`, then `1/5` once the first file is selected (#54 added the count, always with a selection). Directories are drawn in a different face from files, and each entry is annotated with its mode bits (`drwxr-xr-x`), a human-readable size (`5k`, `10M`) and its age (`5s ago`, `3d10h ago`).
            acceptance:
              - "In a directory of 5 entries the prompt starts `*/5 ` and becomes `1/5 ` after `C-n`; `RET` with no selection visits the typed text"
              - "Directories and files are drawn in different faces"
              - "Each entry shows its mode bits, human-readable size and modification age, dimmed and never matched"
            blocked_by: [m0-find-file]
          - key: m5-highlight-matches
            title: "Highlight matched characters in completion lists"
            body: |
              Draw the characters the fuzzy pattern matched in a distinct face in every completion list (`project-find-file`, `find-file`, `M-x`, `C-x b`), as Vertico with orderless does, so it is clear why a candidate matched. `nucleo` already reports the matched indices; annotations are never highlighted.
            acceptance:
              - "Typing `pff` in `M-x` highlights the `p`, `f` and `f` that matched in `project-find-file`"
              - "Every completing prompt highlights its matches, and annotations stay dimmed"
            blocked_by: [m1-find-in-project]
          - key: m5-count-width
            title: "Keep completion lists still while the match count changes"
            body: |
              The count before the prompt (`1/100 `) changes width as matches arrive or the pattern changes, shifting the prompt and making the list appear to jump, most visibly in project grep. Pad the count to a stable width, as Vertico's `vertico-count-format` does. If the jump also comes from the selection or scroll moving while grep batches stream in, fix that too.
            acceptance:
              - "Typing in project grep while the count goes from 9 to 100 matches leaves the prompt text and the list in place"
              - "A test checks the prompt's width stays the same as the count grows"
            blocked_by: [m0-find-file]
      - key: m5-search
        title: "Project grep and search polish"
        labels: [minibuffer, project]
        design: "#subsystems"
        body: |
          Faster project grep, visible progress, matches highlighted in the buffer, and searching large multi-root projects. Tasks are tracked as sub-issues.
        tasks:
          - key: m5-grep-progress
            title: "Show that a project grep is running"
            body: |
              Seen in the "Legacy crap" project (11 roots, about 8,700 files): `INVALID_SITE` showed nothing for 5 s and more, then appeared at once when typed again. Grep has no timeout and caches nothing; its roots are searched in order, file by file, and every hit was in the 7th and 11th roots, so a cold file cache made the first search slow. The prompt shows nothing while a search runs, so a slow search looks like no matches. Show a running search in the prompt (a `[searching]` marker, with the count growing as batches arrive) and `[no matches]` once a finished search found nothing.
            acceptance:
              - "While a search runs the prompt says so; it stops once the search is done, cancelled or superseded"
              - "A finished search with no hits says so"
              - "Core tests cover the running, done and superseded states"
            blocked_by: [m1-grep-service]
          - key: m5-parallel-grep
            title: "Parallel project grep with configurable workers"
            labels: [project, files]
            design: "#subsystems"
            body: |
              Add optional parallel file searching to project grep in M5. Configure the worker count with the positive integer `grep_workers` in `settings.toml`, defaulting to `1`. One worker keeps serial searching; higher values bound the number of concurrent file-search workers. Use the existing settings loading, validation, and reload path, with a reloaded value applying to the next search.

              The 2026-10-25 investigation reproduced the complete 10k-hit/two-root search at about 966 ms on the Mac. File opens accounted for about 844 ms of a 960 ms instrumented search. A temporary throughput prototype measured 933/565/439/380 ms with 1/2/4/8 workers, with all 10,000 ordered hits matching production. The prototype buffered results until completion, so its speedup does not validate production streaming or cancellation. See `docs/refactoring-opportunities.md`, "Grep investigation (#5)", for the measurements and limits.

              Parallelize file searches while preserving the existing root, walk, and line order. Retain a searcher per worker, bound queued work and buffered results, and deliver incremental batches through an ordered coordinator. A direct switch to `ignore::WalkBuilder::build_parallel` is insufficient: it ignores the configured sort order, and directory traversal was only about 28 ms of the measured query. Keep the existing grep semantics and avoid retaining every file handle or caching file contents between queries.
            acceptance:
              - "Given `grep_workers` is omitted or set to `1`, when project grep runs, then it uses one file-search worker and preserves the current ordered results."
              - "Given `grep_workers = N` for a valid integer greater than one and enough files, when project grep runs, then file searches overlap with at most N workers and return the same ordered hits as a one-worker search."
              - "Given the worker count is changed and settings are successfully reloaded, when the next search starts, then it uses the new count; an already-running search keeps its captured count."
              - "Given a zero, negative, or non-integer worker count, when settings load or reload, then the existing configuration error path reports the invalid value and retains the last valid settings, or bundled defaults at startup."
              - "Given a large matching file or files that finish out of order, when hits become eligible for ordered delivery, then the service streams batches using its existing approximate 50 ms checks instead of waiting for the complete search."
              - "Given a superseding query or cancellation, when workers and the coordinator observe it at their file/match/send checks, then outstanding work stops and no more batches for that search are emitted, including when result queues are full."
              - "Given more than the configured hit limit, when the ordered limit is reached, then exactly that many hits and one completion are delivered and unnecessary worker work stops."
              - "Bundled settings document `grep_workers = 1`; configuration and service behavior are covered by tests on macOS and Linux."
              - "Worker count, queued files, buffered results, and open handles remain bounded; ignore rules, smart case, binary handling, unreadable-file handling, and Unicode positions retain their existing behavior."
              - "Record complete-search and first-batch measurements for one and several workers on each platform, without introducing timing thresholds into ordinary CI."
              - "Document the implemented setting and search behavior in docs/editor.md."
            blocked_by: [m1-grep-service, m0-config]
          - key: m5-buffer-match-highlight
            title: "Highlight search matches in the previewed buffer"
            body: |
              While project grep or swiper previews a hit, highlight every match of the pattern in the visible lines of the previewed window, and the selected match more strongly, as consult's preview and swiper do. Highlights are computed by the display builder over the window's lines, as syntax highlighting is, and are gone once the prompt closes; they are not text properties. Matches use the same smart case as the search.
            acceptance:
              - "Previewing a grep hit highlights every visible match in that window and the selected one distinctly"
              - "Swiper highlights its matches the same way"
              - "Nothing stays highlighted after the prompt closes or is aborted"
              - "A test checks a previewed window's match faces"
            blocked_by: [m5-highlight-matches]
          - key: m5-grep-roots
            title: "Grep large multi-root projects"
            body: |
              In a project of many roots, hits from the root the work is in can sit behind thousands of files of other roots. Search the current buffer's root first, so its hits are listed first, then the other roots in their order. `C-u` before project grep asks for the roots to search, completing over the project's root names, consult-style, instead of adding a separate command.
            acceptance:
              - "Project grep lists the current buffer's root's hits before the other roots'"
              - "`C-u C-x p g` asks for a root and searches only that one"
              - "A buffer outside the project's roots searches them in their order"
              - "Spec updated in docs/editor.md"
            blocked_by: [m5-parallel-grep]
      - key: m5-crash
        title: "Crash safety beyond commands"
        labels: [frontend]
        design: "#subsystems"
        body: |
          Crash safety that M0 left out. Break down when M5 starts.
        tasks:
          - key: m5-frontend-catch-unwind
            title: "Contain panics outside commands"
            body: |
              #52 wraps only command calls in `catch_unwind`, so a panic while the frontend applies a service result, fires a timer or renders still ends the process; on macOS, inside the key callback, it aborts. Wrap every frontend call into the core in `catch_unwind` and report it the same way: echo line plus panic and backtrace in `*Messages*`.
            acceptance:
              - "A panic while applying a service result or firing a timer leaves the editor running and logs to Messages"
              - "On macOS, a panic during key handling doesn't abort the process"
            blocked_by: [m0-catch-unwind]
      - key: m5-format
        title: "Formatter commands"
        labels: [text]
        design: "#commands-and-keymaps"
        body: |
          A format command per language (`mix format`, `rustfmt`, prettier) configured in TOML, run with the project's environment, applied as a diff. Not on save. Break down when M5 starts.
      - key: m5-registers-macros
        title: "Registers and keyboard macros"
        labels: [keymap, text]
        design: "#commands-and-keymaps"
        body: |
          Text and position registers; keyboard macro recording and playback on top of the command loop's recorded key stream. Break down when M5 starts.
      - key: m5-navigation
        title: "Jump to definition and file:line jumps"
        labels: [minibuffer]
        design: "#subsystems"
        body: |
          Grep-based jump to definition, and jumping to `file:line` from terminal output, grep hits and agent tool calls. Break down after the spec decision.
        tasks:
          - key: m5-decide-navigation
            title: "Decide: specs for jump to definition and file:line jumps"
            labels: [decision]
            design: "#open-questions"
            body: |
              Per-language definition patterns for grep, how `file:line` references are detected in terminal and session buffers, and the keys. Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
      - key: m5-wgrep
        title: "Editable grep results"
        labels: [minibuffer, text]
        design: "#subsystems"
        body: |
          Export grep results to a buffer, edit the lines, and write the changes back to the files, wgrep style. The spec is written when M5 is broken down.
      - key: m5-editing
        title: "Remaining editing commands"
        labels: [text]
        design: "#commands-and-keymaps"
        body: |
          Implement the commands chosen in M1's "Decide: C-s and the remaining editing commands": comment toggle (`M-;`), fill paragraph (`M-q`) with Markdown prefixes, literal query-replace (`M-%`), save-as (`C-x C-w`) and a global recent files list. Break down when M5 starts.
        tasks:
          - key: m5-next-buffer
            title: "next-buffer and previous-buffer"
            body: |
              Emacs's `C-x <right>` (`next-buffer`) and `C-x <left>` (`previous-buffer`): cycle the selected window through the buffers it has shown, most recent first, as Emacs's per-window previous buffers do. A window that has shown only one buffer falls back to the workspace's other buffers in `buffer-list` order. Today only a global `buffer-list` order exists.
            acceptance:
              - "In a window that showed a, then b, then c, `C-x <left>` shows b, again shows a, and `C-x <right>` goes back to b"
              - "Two windows keep their own histories"
              - "A killed buffer drops out of every window's history"
              - "Spec updated in docs/editor.md"
            blocked_by: [m0-keymap-toml]
          - key: m5-recent-files
            title: "Recent files and projects history"
            body: |
              A global list of recently visited files and recently switched-to projects, kept across restarts as Emacs's `recentf` does, with a completing command to visit one. The welcome dashboard lists from it.
            acceptance:
              - "Visited files and switched-to projects are listed most recent first, and survive a restart"
              - "A completing command visits a recent file; missing files are dropped from the list"
              - "Spec updated in docs/editor.md"
      - key: m5-keymap-config
        title: "Keymap configuration polish"
        labels: [keymap]
        design: "#commands-and-keymaps"
        body: |
          What `keymap.toml` can't express yet. Tasks are tracked as sub-issues.
        tasks:
          - key: m5-keymap-prefixes
            title: "Named keymap prefixes, remappable as a whole"
            body: |
              Today a prefix such as `C-x p` exists only as the first keys of each binding, so moving the project commands to `C-c p` (projectile's prefix) means rebinding every command, and the old keys stay bound because unbinding is unsupported. Give prefixes a name in `keymap.toml` (a prefix keymap such as `project-prefix` holding `c = "project-create"` and so on, bound in `[global]` as `"C-x p" = "project-prefix"`), so a user file can bind the prefix to other keys, or unbind it, in one entry, Emacs's prefix-command style. The which-key hint shows the prefix's name.
            acceptance:
              - "The bundled project, workspace and agent bindings live in named prefix keymaps"
              - "A user `keymap.toml` that binds `C-c p` to the project prefix and unbinds `C-x p` moves every project command, tested with a key script"
              - "A prefix bound to two key sequences works under both"
              - "The which-key hint shows a bound prefix by its name"
              - "Spec updated in docs/editor.md"
            blocked_by: [m0-keymap-toml]
      - key: m5-project-settings
        title: "Project overrides for settings and keymaps"
        labels: [project, keymap]
        design: "#commands-and-keymaps"
        body: |
          VS Code's user and workspace settings, for aiditor: a project file can override any setting of `settings.toml` and any binding of `keymap.toml`, in `[settings]` and `[keymap.<keymap>]` tables. The project layer applies over the user files entry by entry, as the user keymap applies over the bundled one, while a workspace of that project is current; switching workspace switches the layer, and `C-x C-r` reloads it. Bad entries are reported as in the global files. Project-only keys such as `watch` and `max_watched_files` (#191, #192) stay as they are; per-project indent width becomes an ordinary override. Unbinding a key needs "Named keymap prefixes, remappable as a whole" or its own unbind support. Break down when M5 starts.
        blocked_by: [m5-decide-settings]
      - key: m5-visual-design
        title: "Visual design"
        labels: [frontend]
        design: "#subsystems"
        body: |
          One direction for how aiditor looks, settled before the visual work that follows it, then the theme and font configuration and the display features it shapes. Tasks are tracked as sub-issues.
        tasks:
          - key: m5-decide-visual
            title: "Decide: visual direction"
            labels: [decision]
            design: "#open-questions"
            body: |
              Settle the overall look with mockups made in Claude Design: spacing and padding, window dividers and the fringe, the buffer and workspace mode lines' styling, the line number gutter, the minibuffer and completion list, the welcome dashboard, and the direction for the rich session buffer (M6's "Block rows and proportional faces"). Name the faces the look needs, which the theme decision then makes configurable. Record the answer and links to the mockups in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md, with the mockups linked"
              - "The faces the look needs are listed"
          - key: m5-decide-theme
            title: "Decide: theme and font configuration"
            labels: [decision]
            design: "#open-questions"
            body: |
              Today one theme lives in the `[theme]` table of `settings.toml`, with a fixed set of colours and one font family and size, all reloaded by `C-x C-r`. Decide whether themes become their own files picked by name (bundled light and dark ones, user themes in the config dir, a `load-theme` command), which faces the visual direction adds, whether syntax faces gain bold and italic, and what font settings exist beyond family and size (line height, a font per face for the mode line and agent prose). Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
            blocked_by: [m5-decide-visual]
          - key: m5-line-numbers
            title: "Display line numbers"
            body: |
              Emacs's `display-line-numbers-mode`: a gutter of line numbers in file buffers, absolute or relative, the current line's in its own face, styled as the visual direction says. A `line_numbers` setting picks the default and a command toggles it per buffer. The gutter's width follows the buffer's line count, and soft-wrapped continuation lines have no number.
            acceptance:
              - "File buffers show line numbers by the setting, and the command toggles them per buffer"
              - "Relative numbers count from point's line"
              - "Wrapped continuation lines show no number, and the gutter never overlaps text"
              - "A display test checks the gutter"
              - "Spec updated in docs/editor.md"
            blocked_by: [m5-decide-visual]
      - key: m5-workspace-presentation
        title: "Mode lines"
        labels: [frontend, project]
        design: "#workspaces"
        body: |
          Keep the current project and workspace visible across buffer splits and in fullscreen mode with a thin workspace modeline, then settle what it and each buffer's mode line show. Tasks are tracked as sub-issues.
        tasks:
          - key: m5-workspace-modeline
            title: "Add a thin frame-wide workspace modeline"
            body: |
              The native window title currently shows `filename | workspace | project`. In macOS fullscreen mode the title bar is hidden, so workspace and project context is no longer persistently visible. Adding both names to every buffer's mode line would repeat the same information across splits.

              Add a **workspace modeline**: a thin, single-row bar at the top of the editor content, spanning the whole frame above all buffer windows. Show only the current project and workspace, for example `Project aiditor › Workspace watcher-fix`. Keep filenames and buffer-specific state in the existing buffer mode lines, and retain the native window title.

              The workspace modeline is visible in both windowed and fullscreen modes. Keep its height comparable to an ordinary buffer mode line, with minimal padding and no toolbar-sized controls. Additional information can be considered later; this issue only covers project and workspace names and does not require an extension framework, tabs or switching controls.

              ## Behavioral acceptance criteria

              ### Visible frame-wide context
              - **Given** a workspace with one or several split buffer windows
              - **When** the frame is displayed in windowed or fullscreen mode
              - **Then** one workspace modeline appears above all splits and shows the current project and workspace.

              ### Context follows the workspace
              - **Given** the workspace modeline is visible
              - **When** the user switches workspaces, renames the current workspace, or reloads a changed project name
              - **Then** it displays the current names.

              ### Stable context during editing and commands
              - **Given** several buffers in the current workspace
              - **When** the user changes the selected buffer or split, opens a temporary buffer, or uses the minibuffer
              - **Then** the workspace modeline continues to show the current project and workspace in the same position.

              ### Narrow frames and long names
              - **Given** project or workspace names exceed the available width
              - **When** the frame is rendered or resized
              - **Then** the bar remains one row high, with predictable truncation that retains a visible portion of both names and does not overlap buffer content.
            acceptance:
              - "One frame-wide workspace modeline, outside the buffer split tree."
              - "Thin, single-row presentation consistent with the editor's font and theme."
              - "Content limited to project and workspace; existing buffer mode lines and native title retained."
              - "Works on macOS and Linux; macOS fullscreen checked explicitly."
              - "Display behavior covered by tests and documented in `docs/editor.md`."
          - key: m5-spike-mode-lines
            title: "Spike: mode line and workspace modeline contents"
            labels: [spike]
            body: |
              Decide what the workspace modeline and each buffer's mode line show, per buffer type: file, terminal, agent session, grep results, special buffers and the dashboard. Candidates include modified and read-only state, major mode, position and selection size, encoding and line endings, VCS branch, agent mode and status, and the workspace's running agents and terminals. Look at doom-modeline and Zed's status bar, decide which segments live where so nothing repeats across splits, and write the segments and their order per type into `docs/editor.md`, with the follow-up tasks they need.
            acceptance:
              - "Segments per buffer type and for the workspace modeline written into docs/editor.md"
              - "Follow-up tasks added to the roadmap"
            blocked_by: [m5-decide-visual, m5-workspace-modeline]
      - key: m5-dashboard
        title: "Welcome dashboard"
        labels: [frontend, project]
        design: "#projects"
        body: |
          Doom's dashboard for aiditor: a launch with no argument shows a welcome buffer in the `$HOME` workspace (see "Decide: launching without a project"), with quick commands such as recent files, recent projects and open project. Needs a recent files and projects history, which doesn't exist yet (see "Decide: C-s and the remaining editing commands"). Break down when M5 starts.
        blocked_by: [m5-recent-files, m5-decide-visual]
      - key: m5-editor-client
        title: "$EDITOR client for terminal buffers"
        labels: [terminal]
        design: "#subsystems"
        body: |
          Terminals set `EDITOR`/`VISUAL` to a small client that opens the file in a buffer in the terminal's workspace and blocks until the edit is finished or aborted. Mechanism to be decided (likely a Unix socket).
        tasks:
          - key: m2-decide-editor-client
            title: "Decide: $EDITOR client mechanism"
            labels: [decision]
            design: "#open-questions"
            body: |
              Settle how the client reaches the editor and what an edit looks like. Likely answer: one Unix socket per editor process (mode 0600 in a 0700 directory under the runtime dir), its path and the terminal's id passed to each shell in `AIDITOR_SOCKET` and `AIDITOR_TERMINAL`; the client is the `aiditor` binary itself, run as `EDITOR="<current_exe> --wait"` and handled before GPUI starts, so nothing extra ships; it sends its cwd and the files (`+LINE` too, as `git` never passes it but other tools do) and exits with the code the editor replies. Also decide: the finish and abort keys (`C-c C-c` and `C-c C-k` as with-editor, `C-x #` as `server-edit`), which window shows the file and what it shows after, whether finishing saves, and what killing the buffer, killing the terminal or quitting does to a waiting client (abort). Record the answer in `docs/editor.md`.
            acceptance:
              - "Decision recorded in docs/editor.md"
          - key: m2-edit-server
            title: "Edit server and client command"
            body: |
              The services side of the decision: the editor listens on its socket and removes it on quit; terminals get `EDITOR`, `VISUAL` and the client variables in their environment; the client sends its request, blocks for the reply and exits with its code. Requests reach the core as a message carrying the terminal id and absolute paths; the core's reply goes back over the same connection. Requests are untrusted input: a malformed one or an unknown terminal is refused, never crashes the editor.
            acceptance:
              - "Services test: a client request reaches the core channel, and the client exits 0 or 1 with the reply"
              - "The client with no editor socket, or a dead one, prints an error and exits non-zero"
              - "Socket permissions are 0600, and it is gone after quit"
              - "`echo $EDITOR` in a terminal buffer shows the client command"
            blocked_by: [m2-decide-editor-client, m2-pty-spawn]
          - key: m2-edit-buffers
            title: "Finish and abort client edits"
            body: |
              The core opens each requested file in the terminal's workspace, in the window showing that terminal, with a minor mode whose keys finish or abort the edit, as decided. Finishing saves (if decided) and replies success; aborting, killing the buffer, killing its terminal or quitting replies failure. The window then goes back to the terminal.
            acceptance:
              - "`git commit` in a terminal buffer opens COMMIT_EDITMSG; finishing commits, aborting leaves no commit"
              - "`git rebase -i` works the same way"
              - "Killing the buffer or quitting while git waits makes git abort, not hang"
              - "Core tests cover finish, abort and kill-buffer replies"
            blocked_by: [m2-edit-server, m2-term-buffers]

  # ───────────────────────────────────────────── M6 ─────────────────────────────────────────────
  - key: m6
    title: "M6 · Rich session buffer"
    description: "After the MVP: block rows and proportional faces bring the session buffer up to Zed's agent panel."
    gate: "A session with headings, prose, code, a permission request and a tool-call diff reads like Zed's agent panel, and search, mark and kill still work across it."
    epics:
      - key: m6-rich-session
        title: "Block rows and proportional faces"
        labels: [frontend, acp]
        design: "#acp-integration-and-session-management"
        body: |
          Option C of the session-buffer display decision: block rows (non-text rows between lines, with their own height, that point skips) for permission cards, tool-call diffs and images; faces that carry a font family and size for proportional prose and larger headings. Selectable content stays text. Break down when M6 starts.
