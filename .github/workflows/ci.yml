name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts bloat the cached target/ and don't help a fresh checkout.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Rust version from .tool-versions
        run: echo "RUST_VERSION=$(awk '$1 == "rust" {print $2}' .tool-versions)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Install GPUI system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev
      # GPUI compiles its Metal shaders at build time; newer Xcode ships the Metal toolchain separately.
      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      # Not rust-cache: with its environment hash off (image rollouts kept missing) it has no fallback key,
      # so every manifest or lockfile change rebuilt all dependencies from scratch.
      # The manifests go in the key because [profile] edits must invalidate it.
      # shortcut: target/ is never pruned and grows over time; bump the key prefix if the cache gets too big.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/*/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-
      - run: cargo fmt --all --check
      - name: aiditor-core has no GPUI or Tokio dependency
        run: "cargo tree -p aiditor-core > tree.txt && ! grep -E '\\b(gpui|tokio) v' tree.txt"
      # The core's compile_error! only fires in the profiles CI builds; this covers release too.
      - name: No build profile aborts on panic
        run: "! grep -rnE 'panic *=? *\"?abort' Cargo.toml crates/*/Cargo.toml .cargo 2>/dev/null"
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # PR caches are visible only to their own PR and pushed main's caches out of the 10 GB limit.
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Benchmark reporting tests
        run: python3 -m unittest discover -s scripts -p test_benchmarks.py
