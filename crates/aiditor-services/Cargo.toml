[package]
name = "aiditor-services"
version = "0.1.0"
edition = "2024"

[dependencies]
aiditor-core = { path = "../aiditor-core" }
agent-client-protocol = "3.3.0"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
notify = "8.2.0"
nucleo = "0.5.0"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tree-sitter = "0.27.1"
tree-sitter-elixir = "0.3.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.5.3"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
