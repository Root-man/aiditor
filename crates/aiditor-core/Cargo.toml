[package]
name = "aiditor-core"
version = "0.1.0"
edition = "2024"

# No gpui or tokio here: the core is a plain state machine (CI checks this).
[dependencies]
alacritty_terminal = "0.26.0"
nucleo = "0.5.0"
# Only LF breaks lines, so line numbers match compilers and grep.
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tracing = "0.1.44"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"
