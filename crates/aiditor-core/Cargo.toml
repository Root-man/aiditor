[package]
name = "aiditor-core"
version = "0.1.0"
edition = "2024"

# No gpui or tokio here: the core is a plain state machine (CI checks this).
[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
libc = "0.2.189"
nucleo = "0.5.0"
regex = "1.13.1"
# Only LF breaks lines, so line numbers match compilers and grep.
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
similar = "2.7.0"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tree-sitter = "0.27.1"
tree-sitter-elixir = "0.3.5"
tree-sitter-heex = "0.8.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.5.4"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"

[[bench]]
name = "core"
harness = false
test = false
