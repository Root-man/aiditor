# Bundled defaults. Copy any key to settings.toml in the config dir to override it.

# Which [themes.<name>] table to draw, merged over themes.default; C-x C-r applies a change.
theme = "default"

# font_family = "Menlo"  # unset: Menlo on macOS, Noto Sans Mono on Linux
font_size = 14.0
# Line height as a multiple of font_size, 1 to 3.
line_height = 1.4
# The workspace modeline's size, 6 to 72. The text-scale commands move it with font_size.
workspace_font_size = 13.0
# macOS: Option as Meta, or false to type special characters and dead keys with it.
option_as_meta = true

# Line numbers in files, *scratch* and *Messages*: "off", "absolute" or "relative" to point's line.
line_numbers = "absolute"
# Point's line in the hl-line background, in the selected window; false turns it off.
hl_line = true

# Maximum kept files and directories per watched project; project files can override it.
max_watched_files = 10000

# Files project grep searches at once; 1 searches them one by one.
grep_workers = 1

# Agents by name: an ACP adapter's command, args, env (on top of the captured environment, under a
# project file's) and the session mode to start in. A user table changes single keys or adds an agent.
[agents.claude]
command = "claude-agent-acp"  # found on PATH; set a full path, or npx and args, to run it otherwise
default_mode = "auto"
# The Claude Agent SDK leaves its to-do and task tools off; they are what sends ACP plans.
env = { CLAUDE_CODE_ENABLE_TASKS = "1", CLAUDE_CODE_ENABLE_TODO_TOOLS = "1" }

# A theme holds ansi, faces and syntax, and lists only what it changes from themes.default.
# The 16 ANSI colours terminals use: black, red, green, yellow, blue, magenta, cyan, white, then their bright forms.
[themes.default]
ansi = [
  0x000000, 0xcd3131, 0x0dbc79, 0xe5e510, 0x2472c8, 0xbc3fbc, 0x11a8cd, 0xe5e5e5,
  0x666666, 0xf14c4c, 0x23d18b, 0xf5f543, 0x3b8eea, 0xd670d6, 0x29b8db, 0xe5e5e5,
]

# A face has fg, bg, bold, italic and underline; what it leaves unset takes what is underneath.
[themes.default.faces]
default = { fg = 0xd4d4d4, bg = 0x1e1e1e }
cursor = { fg = 0x1e1e1e, bg = 0xffcc00 }
echo = { fg = 0x808080 }
separator = { fg = 0x808080 }
mode-line = { fg = 0xd4d4d4, bg = 0x3c3c3c }
mode-line-inactive = { fg = 0xd4d4d4, bg = 0x282828 }
mode-line-dim = { fg = 0x808080 }
mode-line-buffer-id = { bold = true }
mode-line-elixir = { fg = 0xdf91bf }
mode-line-javascript = { fg = 0xb5cea8 }
mode-line-typescript = { fg = 0x82aaff }
mode-line-rust = { fg = 0xed927b }
mode-line-yaml = { fg = 0xdcdcaa }
mode-line-markdown = { fg = 0x4ec9b0 }
mode-line-toml = { fg = 0xd9a066 }
workspace-bar = { fg = 0xd4d4d4, bg = 0x282828 }
workspace-current = { fg = 0xffcc00 }
divider = { bg = 0x3c3c3c }
line-number = { fg = 0x808080 }
line-number-current = { fg = 0xd4d4d4 }
hl-line = { bg = 0x2a2a2a }
region = { bg = 0x264f78 }
match = { bg = 0x613315 }
match-current = { fg = 0x1e1e1e, bg = 0xffcc00, bold = true }
completion-match = { fg = 0x569cd6, bold = true }
completion-selected = { bg = 0x264f78 }
annotation = { fg = 0x808080 }
prompt = { fg = 0x569cd6, bold = true }
directory = { fg = 0x569cd6, bold = true }
grep-file = { fg = 0x4ec9b0, italic = true }
grep-line-number = { fg = 0xb5cea8 }
vcs-branch = { fg = 0x4ec9b0 }
status-modified = { fg = 0xce9178 }
status-waiting = { fg = 0xe5e510 }
status-running = { fg = 0x0dbc79 }
status-failed = { fg = 0xf14c4c }
status-info = { fg = 0x569cd6 }
session-user = { bg = 0x2a2a2a }
session-thought = { fg = 0x808080 }
session-block = { bg = 0x2a2a2a }
session-code = { fg = 0xce9178 }
diff-added = { fg = 0x0dbc79 }
diff-removed = { fg = 0xf14c4c }
diff-hunk = { fg = 0x569cd6 }
key-hint = { fg = 0x1e1e1e, bg = 0xffcc00, bold = true }
