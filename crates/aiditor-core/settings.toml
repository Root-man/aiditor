# Bundled defaults. Copy any key to settings.toml in the config dir to override it.

# font_family = "Menlo"  # unset: Menlo on macOS, Noto Sans Mono on Linux
font_size = 14.0
# macOS: Option as Meta, or false to type special characters and dead keys with it.
option_as_meta = true

# Maximum kept files and directories per watched project; project files can override it.
max_watched_files = 10000

# Files project grep searches at once; 1 searches them one by one.
grep_workers = 1

# Agents by name: an ACP adapter's command, args, env (on top of the captured environment, under a
# project file's) and the session mode to start in. A user table changes single keys or adds an agent.
[agents.claude]
command = "claude-agent-acp"  # found on PATH; set a full path, or npx and args, to run it otherwise
default_mode = "auto"
# The Claude Agent SDK leaves its to-do and task tools off; they are what sends ACP plans.
env = { CLAUDE_CODE_ENABLE_TASKS = "1", CLAUDE_CODE_ENABLE_TODO_TOOLS = "1" }

[theme]
background = 0x1e1e1e
foreground = 0xd4d4d4
cursor = 0xffcc00
region = 0x264f78
# The selected window's mode line, and the other windows'.
mode_line = 0x3c3c3c
mode_line_inactive = 0x282828
# Agent thoughts' text, and code's background in agent messages.
dim = 0x808080
code_block = 0x2a2a2a
# The 16 ANSI colours terminals use: black, red, green, yellow, blue, magenta, cyan, white, then their bright forms.
ansi = [
  0x000000, 0xcd3131, 0x0dbc79, 0xe5e510, 0x2472c8, 0xbc3fbc, 0x11a8cd, 0xe5e5e5,
  0x666666, 0xf14c4c, 0x23d18b, 0xf5f543, 0x3b8eea, 0xd670d6, 0x29b8db, 0xe5e5e5,
]

# Code colours by tree-sitter capture name; one without an entry takes its longest dotted
# prefix's (`function.method` falls back to `function`), and none means the foreground.
[theme.syntax]
attribute = 0x9cdcfe
boolean = 0x569cd6
comment = 0x6a9955
constant = 0x4fc1ff
"constant.builtin" = 0x569cd6
constructor = 0x4ec9b0
function = 0xdcdcaa
keyword = 0x569cd6
module = 0x4ec9b0
number = 0xb5cea8
operator = 0xd4d4d4
property = 0x9cdcfe
"punctuation.special" = 0x6796e6
string = 0xce9178
"string.special" = 0xd16969
tag = 0x569cd6
"text.literal" = 0xce9178
"text.reference" = 0x9cdcfe
"text.title" = 0x569cd6
"text.uri" = 0xce9178
type = 0x4ec9b0
variable = 0x9cdcfe
"variable.builtin" = 0x569cd6
"variable.parameter" = 0x9cdcfe
