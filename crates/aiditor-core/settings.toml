# Code's faces by tree-sitter capture name; one without an entry takes its longest dotted
# prefix's (`function.method` falls back to `function`), and none means the default face.
[themes.default.syntax]
attribute = { fg = 0x9cdcfe }
boolean = { fg = 0x569cd6 }
comment = { fg = 0x6a9955 }
constant = { fg = 0x4fc1ff }
"constant.builtin" = { fg = 0x569cd6 }
constructor = { fg = 0x4ec9b0 }
function = { fg = 0xdcdcaa }
keyword = { fg = 0x569cd6 }
module = { fg = 0x4ec9b0 }
number = { fg = 0xb5cea8 }
operator = { fg = 0xd4d4d4 }
property = { fg = 0x9cdcfe }
"punctuation.special" = { fg = 0x6796e6 }
string = { fg = 0xce9178 }
"string.special" = { fg = 0xd16969 }
tag = { fg = 0x569cd6 }
"text.literal" = { fg = 0xce9178 }
"text.reference" = { fg = 0x9cdcfe }
"text.title" = { fg = 0x569cd6 }
"text.uri" = { fg = 0xce9178 }
type = { fg = 0x4ec9b0 }
variable = { fg = 0x9cdcfe }
"variable.builtin" = { fg = 0x569cd6 }
"variable.parameter" = { fg = 0x9cdcfe }
