# Bundled keymaps. Copy an entry to keymap.toml in the config dir to rebind it.
# Each table is a keymap: `global`, or a mode's name. Keys are `kbd`-style sequences.

[global]
# Linux reports C-? and C-_ with shift held, macOS without.
"C-/" = "undo"
"C-_" = "undo"
"C-S-_" = "undo"
"C-x u" = "undo"
"C-?" = "undo-redo"
"C-S-?" = "undo-redo"
"C-x C-s" = "save-buffer"
"C-x C-f" = "find-file"
"C-x C-c" = "save-buffers-kill-terminal"
"C-x C-r" = "reload-settings"
# Named prefixes, defined in their own tables below; bind one to other keys, or unbind it with
# `false`, in one entry.
"C-x p" = "project-prefix"
"C-x t" = "workspace-prefix"
"C-x a" = "agent-prefix"
"C-g" = "keyboard-quit"
"M-x" = "execute-extended-command"
"C-u" = "universal-argument"
"M--" = "negative-argument"
"M-0" = "digit-argument"
"M-1" = "digit-argument"
"M-2" = "digit-argument"
"M-3" = "digit-argument"
"M-4" = "digit-argument"
"M-5" = "digit-argument"
"M-6" = "digit-argument"
"M-7" = "digit-argument"
"M-8" = "digit-argument"
"M-9" = "digit-argument"
"C-f" = "forward-char"
"<right>" = "forward-char"
"C-b" = "backward-char"
"<left>" = "backward-char"
"C-n" = "next-line"
"<down>" = "next-line"
"C-p" = "previous-line"
"<up>" = "previous-line"
"M-f" = "forward-word"
"M-b" = "backward-word"
"C-a" = "move-beginning-of-line"
"C-e" = "move-end-of-line"
# Linux reports M-< and M-> with shift held, as C-_ above.
"M-<" = "beginning-of-buffer"
"M-S-<" = "beginning-of-buffer"
"M->" = "end-of-buffer"
"M-S->" = "end-of-buffer"
"C-v" = "scroll-up-command"
"M-v" = "scroll-down-command"
"C-l" = "recenter-top-bottom"
"RET" = "newline"
"C-j" = "electric-newline-and-maybe-indent"
"C-o" = "open-line"
"C-d" = "delete-char"
"DEL" = "delete-backward-char"
"M-d" = "kill-word"
"M-DEL" = "backward-kill-word"
"C-SPC" = "set-mark-command"
"C-x C-x" = "exchange-point-and-mark"
"C-x 2" = "split-window-below"
"C-x 3" = "split-window-right"
"C-x o" = "other-window"
"C-x 0" = "delete-window"
"C-x 1" = "delete-other-windows"
"C-x b" = "switch-to-buffer"
"C-x 4 b" = "switch-to-buffer-other-window"
"C-x k" = "kill-buffer"
"C-x <left>" = "previous-buffer"
"C-x <right>" = "next-buffer"
"C-k" = "kill-line"
"C-s" = "swiper"
"M-," = "xref-go-back"
"C-M-," = "xref-go-forward"
"C-w" = "kill-region"
"M-w" = "kill-ring-save"
"C-y" = "yank"
"M-y" = "yank-pop"
# Cmd keys; s-w and s-h wait for frames.
"s-q" = "save-buffers-kill-terminal"
"s-z" = "undo"
"s-s" = "save-buffer"
# Copy, cut and paste are in keymap-macos.toml and keymap-linux.toml.

[project-prefix]
"c" = "project-create"
"a" = "project-add-root"
"r" = "project-remove-root"
"d" = "project-set-default-agent"
"w" = "project-set-watch"
"o" = "project-open-file"
"s" = "project-save"
"p" = "project-switch"
"i" = "project-index"
"f" = "project-find-file"
"g" = "project-grep"

# Workspaces, on Emacs's tab-bar prefix.
[workspace-prefix]
"2" = "workspace-new"
"RET" = "workspace-switch"
"o" = "workspace-next"
"O" = "workspace-previous"
"r" = "workspace-rename"
"0" = "workspace-kill-current"
"k" = "workspace-kill"
"l" = "workspace-list"

[agent-prefix]
"a" = "agent-start"
"l" = "agent-sessions"
"f" = "agent-fork-session"
"r" = "agent-rollback-session"
"m" = "agent-select-model"
"e" = "agent-select-effort"

[workspace-list-mode]
"g" = "workspace-list"
"TAB" = "workspace-list-toggle"
"n" = "workspace-list-next"
"p" = "workspace-list-previous"
"C-n" = "workspace-list-next"
"C-p" = "workspace-list-previous"
"<down>" = "workspace-list-next"
"<up>" = "workspace-list-previous"
"RET" = "workspace-list-visit"
"q" = "workspace-list-quit"
"C-g" = "workspace-list-quit"

# Terminal buffers in char mode, where every key but C-x, C-c, M-x and Cmd keys (and C-S-v on
# Linux) goes to the shell.
[vterm-mode]
"C-c C-c" = "vterm-send-C-c"
"C-c C-t" = "vterm-copy-mode"

# A terminal buffer in copy mode, a read-only buffer over its scrollback.
[vterm-copy-mode]
"RET" = "vterm-copy-mode-done"
"C-c C-p" = "vterm-previous-prompt"
"C-c C-n" = "vterm-next-prompt"
"C-c C-r" = "vterm-mark-output"

# A buffer an `aiditor --wait` client in a terminal, such as git, waits on.
[server-edit]
"C-c C-c" = "server-edit"
"C-x #" = "server-edit"
"C-c C-k" = "server-edit-abort"

# Agent session buffers: the read-only transcript above a prompt area. C-j inserts a newline as
# everywhere.
[agent-session-mode]
"RET" = "agent-send-input"
"S-RET" = "newline"
"C-c C-c" = "agent-cancel"
"TAB" = "agent-toggle-tool-call"
"C-t" = "agent-toggle-prompt"
"S-TAB" = "agent-cycle-mode"
"/" = "agent-slash"
"@" = "agent-reference"
"C-c C-y" = "agent-allow-once"
"C-c C-k" = "agent-reject-once"
"C-c C-q" = "agent-goto-question"
"1" = "agent-question-key"
"2" = "agent-question-key"
"3" = "agent-question-key"
"4" = "agent-question-key"
"5" = "agent-question-key"
"6" = "agent-question-key"
"7" = "agent-question-key"
"8" = "agent-question-key"
"9" = "agent-question-key"
"o" = "agent-question-key"
"C-c C-p" = "agent-previous-message"
"C-c C-n" = "agent-next-message"

# The read-only list of an agent's past sessions.
[agent-sessions-mode]
"n" = "agent-sessions-next"
"p" = "agent-sessions-previous"
"C-n" = "agent-sessions-next"
"C-p" = "agent-sessions-previous"
"<down>" = "agent-sessions-next"
"<up>" = "agent-sessions-previous"
"RET" = "agent-sessions-visit"
"TAB" = "agent-sessions-toggle"
"s" = "agent-sessions-search"
"P" = "agent-sessions-pin"
"a" = "agent-sessions-archive"
"g" = "agent-sessions"
"q" = "agent-sessions-quit"

[minibuffer-mode]
"RET" = "exit-minibuffer"
"C-g" = "abort-minibuffers"
"M-p" = "previous-history-element"
"M-n" = "next-history-element"

# Each minibuffer has its command's name as a minor mode.
[swiper]
"C-s" = "swiper-C-s"

[agent-attach-file]
"C-RET" = "minibuffer-attach-file"

# A minor mode of a minibuffer that completes over candidates.
[minibuffer-completion]
"C-n" = "minibuffer-next-completion"
"<down>" = "minibuffer-next-completion"
"C-p" = "minibuffer-previous-completion"
"<up>" = "minibuffer-previous-completion"
"TAB" = "minibuffer-complete"
"M-RET" = "minibuffer-exit-input"
# Deletes a whole directory in file prompts, a char elsewhere.
"DEL" = "minibuffer-directory-delete-char"
