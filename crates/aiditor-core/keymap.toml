# Bundled keymaps. Copy an entry to keymap.toml in the config dir to rebind it.
# Each table is a keymap: `global`, or a mode's name. Keys are `kbd`-style sequences.

[global]
# Linux reports C-? and C-_ with shift held, macOS without.
"C-/" = "undo"
"C-_" = "undo"
"C-S-_" = "undo"
"C-x u" = "undo"
"C-?" = "undo-redo"
"C-S-?" = "undo-redo"
"C-x C-s" = "save-buffer"
"C-x C-r" = "reload-settings"
"C-g" = "keyboard-quit"
"M-x" = "execute-extended-command"
"C-u" = "universal-argument"
"C--" = "negative-argument"
"M-0" = "digit-argument"
"M-1" = "digit-argument"
"M-2" = "digit-argument"
"M-3" = "digit-argument"
"M-4" = "digit-argument"
"M-5" = "digit-argument"
"M-6" = "digit-argument"
"M-7" = "digit-argument"
"M-8" = "digit-argument"
"M-9" = "digit-argument"
"C-f" = "forward-char"
"<right>" = "forward-char"
"C-b" = "backward-char"
"<left>" = "backward-char"
"C-n" = "next-line"
"<down>" = "next-line"
"C-p" = "previous-line"
"<up>" = "previous-line"
"M-f" = "forward-word"
"M-b" = "backward-word"
"C-a" = "move-beginning-of-line"
"C-e" = "move-end-of-line"
# Linux reports M-< and M-> with shift held, as C-_ above.
"M-<" = "beginning-of-buffer"
"M-S-<" = "beginning-of-buffer"
"M->" = "end-of-buffer"
"M-S->" = "end-of-buffer"
"C-v" = "scroll-up-command"
"M-v" = "scroll-down-command"
"C-l" = "recenter-top-bottom"
"RET" = "newline"
"C-j" = "electric-newline-and-maybe-indent"
"C-o" = "open-line"
"C-d" = "delete-char"
"DEL" = "delete-backward-char"
"M-d" = "kill-word"
"M-DEL" = "backward-kill-word"
"C-SPC" = "set-mark-command"
"C-x C-x" = "exchange-point-and-mark"
"C-x 2" = "split-window-below"
"C-x 3" = "split-window-right"
"C-x o" = "other-window"
"C-x 0" = "delete-window"
"C-x 1" = "delete-other-windows"
"C-k" = "kill-line"
"C-w" = "kill-region"
"M-w" = "kill-ring-save"
"C-y" = "yank"
"M-y" = "yank-pop"
# Cmd keys; s-q, s-w and s-h come with quitting.
"s-z" = "undo"
"s-s" = "save-buffer"
"s-x" = "kill-region"
"s-c" = "kill-ring-save"
"s-v" = "yank"

[minibuffer-mode]
"RET" = "exit-minibuffer"
"C-g" = "abort-minibuffers"
"M-p" = "previous-history-element"
"M-n" = "next-history-element"

# A minor mode of a minibuffer that completes over candidates.
[minibuffer-completion]
"C-n" = "minibuffer-next-completion"
"<down>" = "minibuffer-next-completion"
"C-p" = "minibuffer-previous-completion"
"<up>" = "minibuffer-previous-completion"
"TAB" = "minibuffer-complete"
