[package]
name = "aiditor"
version = "0.1.0"
edition = "2024"

[dependencies]
aiditor-core = { path = "../aiditor-core" }
aiditor-services = { path = "../aiditor-services" }
directories = "6.0.0"
gpui = "0.2.2"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "~4.18"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile = "3.27.0"
