[package]
name = "aiditor"
version = "0.1.0"
edition = "2024"

[dependencies]
aiditor-core = { path = "../aiditor-core" }
aiditor-services = { path = "../aiditor-services" }
directories = "6.0.0"
gpui = "0.2.2"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile = "3.27.0"
